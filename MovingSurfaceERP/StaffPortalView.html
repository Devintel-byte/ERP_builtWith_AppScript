<div class="wrap">
  <div id="login" class="card"><h2>Moving Surface Staff Portal</h2><p class="muted">Sign in with your Staff ID and four-digit PIN. You can use any phone or computer.</p><label for="staffId">Staff ID</label><input id="staffId" autocomplete="username" placeholder="e.g. MS-001"><label for="pin">Four-digit PIN</label><input id="pin" type="password" inputmode="numeric" autocomplete="current-password" maxlength="4" pattern="[0-9]{4}" placeholder="0000"><button class="green" onclick="login()">Login</button><div id="msg" class="msg"></div><p class="recovery-link"><a id="recoveryLink" href="#">Forgot your PIN? Reset it</a></p><p class="muted">First time here? <a id="attendanceLink" href="#">Open Attendance to create your PIN</a>.</p></div>
  <div id="app" class="hidden">
    <div class="card top"><div><h2 style="margin:0">My Staff Portal</h2><div class="muted" id="welcome"></div></div><button class="smallbtn gray" onclick="refresh()">Refresh</button></div>
    <div id="globalMsg" class="msg"></div>
    <div class="card tabs">
      <button class="tabbtn active" onclick="showTab('dash',this)">Dashboard</button>
      <button class="tabbtn" onclick="showTab('requisition',this)">Requisition</button>
      <button class="tabbtn" onclick="showTab('leave',this)">Leave</button>
      <button class="tabbtn" onclick="showTab('expense',this)">Expense Claim</button>
      <button class="tabbtn" onclick="showTab('history',this)">My History</button>
      <button class="tabbtn" onclick="logout()">Logout</button>
    </div>
    <section id="tab_dash"></section>
    <section id="tab_requisition" class="hidden"></section>
    <section id="tab_leave" class="hidden"></section>
    <section id="tab_expense" class="hidden"></section>
    <section id="tab_history" class="hidden"></section>
  </div>
</div>
<script>
/** Reference vocabularies shipped with the portal payload. */
function refList(name){return (S&&S.refData&&S.refData[name])||[];}
/** A picker whose first entry is a real placeholder: visible, never submitted. */
function staffPicker(values,placeholder){return '<option value="" disabled selected>'+esc(placeholder)+'</option>'+(values||[]).map(v=>'<option>'+esc(v)+'</option>').join('');}

let S=null, staffId='', pin='', activeOperationToast='';
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function money(n){return 'NGN '+Number(n||0).toLocaleString('en-NG');}
function val(id){const e=document.getElementById(id);return e?e.value:'';}
function msg(t,c,id){const el=document.getElementById(id||'msg');el.style.display='block';el.className='msg '+c;el.textContent=t;}
function gmsg(t,c){const el=document.getElementById('globalMsg');el.style.display='none';if(c==='wait'){if(activeOperationToast)window.dismissAppToast(activeOperationToast);activeOperationToast=window.showAppToast(String(t),'loading','Staff portal',{persistent:true});return;}if(activeOperationToast){window.dismissAppToast(activeOperationToast);activeOperationToast='';}if(c==='ok'&&String(t)!=='Loaded successfully')window.showAppToast(String(t),/\bqueued\b/i.test(String(t))?'info':'success',/\bqueued\b/i.test(String(t))?'Notification queued':'Update complete');else if(c==='bad')window.showAppToast(String(t),'error','Action failed');}
function login(){staffId=val('staffId').trim();pin=val('pin').trim();if(!staffId||!/^\d{4}$/.test(pin)){msg('Enter your Staff ID and all four PIN digits, including any leading zero.','bad');return;}gmsg('Signing in…','wait');google.script.run.withSuccessHandler(function(result){render(result);if(result&&result.success){window.showAppToast('Welcome back, '+result.staff.name+'.','success','Signed in');notifyStaffInbox(result);}}).withFailureHandler(e=>gmsg('Sign-in failed: '+(e.message||e),'bad')).staffPortalGetData({staffId:staffId,pin:pin,logSignIn:true});}
function notifyStaffInbox(data){const requests=(data.requisitions||[]).filter(row=>/^(Approved|Rejected)/i.test(String(row.status||''))),expenses=(data.expenses||[]).filter(row=>/^(Approved|Rejected|Paid)/i.test(String(row.status||'')));if(requests.length){const latest=requests[requests.length-1];window.showAppToast('Requisition '+latest.reqId+' is '+latest.status+'.','info','Requisition update');}if(expenses.length){const latest=expenses[expenses.length-1];window.showAppToast('Expense claim '+latest.claimId+' is '+latest.status+'.','info','Expense update');}}
function refresh(){if(!staffId)return;gmsg('Refreshing...','wait');google.script.run.withSuccessHandler(render).withFailureHandler(e=>gmsg('Script error: '+(e.message||e),'bad')).staffPortalGetData({staffId:staffId,pin:pin});}
function logout(){window.confirmAppAction({title:'Log out of the staff portal?',message:'You will need to sign in again to continue.',confirmText:'Log out',danger:true}).then(confirmed=>{if(!confirmed)return;S=null;staffId='';pin='';document.getElementById('staffId').value='';document.getElementById('pin').value='';document.getElementById('app').className='hidden';document.getElementById('login').className='card';});}
function render(res){if(!res||!res.success){gmsg((res&&res.message)||'Login failed','bad');return;}S=res;document.getElementById('login').className='card hidden';document.getElementById('app').className='';document.getElementById('welcome').textContent=res.staff.name+' | '+res.staff.department+' | '+res.staff.id;gmsg('Loaded successfully','ok');drawAll();}
function showTab(name,btn){document.querySelectorAll('section').forEach(s=>s.classList.add('hidden'));document.getElementById('tab_'+name).classList.remove('hidden');document.querySelectorAll('.tabbtn').forEach(b=>b.classList.remove('active'));if(btn)btn.classList.add('active');}
function kpi(t,v,n){return '<div class="kpi"><b>'+esc(v)+'</b>'+esc(t)+'<div class="muted">'+esc(n||'')+'</div></div>';}
function drawAll(){drawDash();drawReq();drawLeave();drawExpense();drawHistory();}
function drawDash(){const s=S.summary;document.getElementById('tab_dash').innerHTML='<div class="grid">'+kpi('Pending Requisitions',s.pendingReq,'Awaiting approval')+kpi('Open Leave Requests',s.openLeave,'Pending/active')+kpi('Open Expense Claims',s.openExpense,'Pending/awaiting accounts')+kpi('Assigned Assets',s.assignedAssets,'Currently assigned')+'</div><div class="two"><div class="card"><h3>My Profile</h3><p><b>'+esc(S.staff.name)+'</b><br>'+esc(S.staff.designation||'')+'<br>'+esc(S.staff.department||'')+'</p><p class="muted">Use this portal for leave, expense claims, requisitions and request tracking.</p></div><div class="card"><h3>Important Note</h3><p class="muted">Inventory and asset registers are controlled from the Admin/ERP portal. Staff can request items through Requisition; store/admin issues inventory after approval.</p></div></div>';}
function addItem(){const div=document.createElement('div');div.className='itemrow';div.innerHTML='<div><label>Item Name</label><input class="riName" placeholder="e.g. HDMI cable"></div><div><label>Qty</label><input class="riQty" type="number" min="1" step="1" placeholder="1" oninput="calcTotal()"></div><div><label>Unit Cost</label><input class="riCost" type="number" min="0" placeholder="0" oninput="calcTotal()"></div><button type="button" class="smallbtn danger" onclick="this.parentNode.remove();calcTotal()">Remove</button>';document.getElementById('reqItems').appendChild(div);}
function getItems(){return Array.from(document.querySelectorAll('#reqItems .itemrow')).map(r=>({itemName:r.querySelector('.riName').value,quantity:r.querySelector('.riQty').value,unitCost:r.querySelector('.riCost').value})).filter(x=>x.itemName);}
function calcTotal(){let total=0;getItems().forEach(x=>total+=(Number(x.quantity||0)*Number(x.unitCost||0)));document.getElementById('reqTotal').textContent=money(total);}
function drawReq(){document.getElementById('tab_requisition').innerHTML='<div class="card"><h3>Submit Item Requisition</h3><div class="three"><div><label for="reqProject">Project/Event</label><input id="reqProject" placeholder="NOG 2026"></div><div><label for="reqPriority">Priority</label><select id="reqPriority">'+staffPicker(refList('priorities'),'Select a priority…')+'</select></div><div><label>Needed Before</label><input id="reqNeeded" type="date"></div></div><div id="reqItems"></div><button type="button" class="smallbtn gray" onclick="addItem()">+ Add Item</button><p><b>Total:</b> <span id="reqTotal">NGN 0</span></p><label>Purpose / Justification</label><textarea id="reqPurpose"></textarea><label>Attachment Link</label><input id="reqAttachment" placeholder="Quotation / receipt / Drive link"><button class="green" onclick="submitReq()">Submit Requisition</button></div>';setTimeout(()=>{addItem();calcTotal();},0);}
document.getElementById('pin').addEventListener('input',function(){this.value=this.value.replace(/\D/g,'').slice(0,4);});
google.script.run.withSuccessHandler(function(url){if(url)document.getElementById('recoveryLink').href=url;}).getStaffRecoveryUrl();
google.script.run.withSuccessHandler(function(url){if(url)document.getElementById('attendanceLink').href=url;}).getAttendanceUrl();
function submitReq(){const p={staffId:staffId,pin:pin,project:val('reqProject'),priority:val('reqPriority'),neededBefore:val('reqNeeded'),purpose:val('reqPurpose'),attachment:val('reqAttachment'),items:getItems()};gmsg('Submitting requisition...','wait');google.script.run.withSuccessHandler(r=>{gmsg(r.message,r.success?'ok':'bad');if(r.success)refresh();}).withFailureHandler(e=>gmsg('Script error: '+(e.message||e),'bad')).submitItemRequisition(p);}
function drawLeave(){document.getElementById('tab_leave').innerHTML='<div class="card"><h3>Submit Leave Request</h3><div class="three"><div><label for="leaveType">Leave Type</label><select id="leaveType">'+staffPicker(refList('leaveTypes'),'Select a leave type…')+'</select></div><div><label>Start Date</label><input id="leaveStart" type="date"></div><div><label>End Date</label><input id="leaveEnd" type="date"></div></div><label>Reason</label><textarea id="leaveReason"></textarea><button class="green" onclick="submitLeave()">Submit Leave</button></div>';}
function submitLeave(){const p={staffId:staffId,pin:pin,leaveType:val('leaveType'),startDate:val('leaveStart'),endDate:val('leaveEnd'),reason:val('leaveReason')};gmsg('Submitting leave...','wait');google.script.run.withSuccessHandler(r=>{gmsg(r.message,r.success?'ok':'bad');if(r.success)refresh();}).withFailureHandler(e=>gmsg('Script error: '+(e.message||e),'bad')).staffSubmitLeaveRequest(p);}
function drawExpense(){document.getElementById('tab_expense').innerHTML='<div class="card"><h3>Submit Expense Claim</h3><div class="three"><div><label>Expense Date</label><input id="expDate" type="date"></div><div><label for="expCat">Category</label><select id="expCat">'+staffPicker(refList('costCategories'),'Select a category…')+'</select></div><div><label for="expAmount">Amount</label><input id="expAmount" type="number" min="0" placeholder="0"></div><div><label>Project/Event</label><input id="expProject"></div><div><label>Receipt Link</label><input id="expReceipt"></div></div><label>Purpose</label><textarea id="expPurpose"></textarea><button class="green" onclick="submitExpense()">Submit Expense Claim</button></div>';}
function submitExpense(){const p={staffId:staffId,pin:pin,expenseDate:val('expDate'),category:val('expCat'),project:val('expProject'),amount:val('expAmount'),receipt:val('expReceipt'),purpose:val('expPurpose')};gmsg('Submitting expense...','wait');google.script.run.withSuccessHandler(r=>{gmsg(r.message,r.success?'ok':'bad');if(r.success)refresh();}).withFailureHandler(e=>gmsg('Script error: '+(e.message||e),'bad')).staffSubmitExpenseClaim(p);}
function table(rows,heads,fn){if(!rows||!rows.length)return '<p class="muted">No records found.</p>';return '<div class="tablewrap"><table><thead><tr>'+heads.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+fn(r).map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';}
function drawHistory(){let html='<div class="card"><h3>My Requisitions</h3>'+table(S.requisitions,['ID','Date','Status','Total','Items'],r=>[esc(r.reqId),esc(r.timestamp),esc(r.status),money(r.total),esc(r.itemsSummary)])+'</div>';html+='<div class="card"><h3>My Leave Requests</h3>'+table(S.leaveRequests,['ID','Type','Start','End','Days','Status'],r=>[esc(r.leaveId),esc(r.leaveType),esc(r.startDate),esc(r.endDate),esc(r.days),esc(r.status)])+'</div>';html+='<div class="card"><h3>My Expense Claims</h3>'+table(S.expenses,['ID','Date','Category','Amount','Status','Accounts'],r=>[esc(r.claimId),esc(r.expenseDate),esc(r.category),money(r.amount),esc(r.status),esc(r.accountsStatus)])+'</div>';html+='<div class="card"><h3>My Assigned Assets</h3>'+table(S.assets,['Asset ID','Name','Category','Condition','Return Due'],r=>[esc(r.assetId),esc(r.assetName),esc(r.category),esc(r.condition),esc(r.returnDueDate)])+'</div>';html+='<div class="card"><h3>Recent Attendance</h3>'+table(S.attendance,['Date','Action','Time','Checkout time','Checkout type','Status','Location'],r=>[esc(r.dateKey),esc(r.action),esc(r.time),esc(r.checkoutTime||'—'),esc(r.checkoutType||'—'),esc(r.status),esc(r.location)])+'</div>';document.getElementById('tab_history').innerHTML=html;}
</script>
