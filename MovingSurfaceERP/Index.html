          const iconPaths = paths[name];
          if (!iconPaths && window.console && console.warn) {
            console.warn('Icon "' + name + '" is not in the registry; showing a placeholder instead.');

          icon.innerHTML = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (iconPaths || MISSING_ICON) + '</svg>';

          const scope = root || document;
          if (scope.nodeType === 1 && scope.matches && scope.matches('i[data-lucide]')) renderIcon(scope);

          scope.querySelectorAll('i[data-lucide]').forEach(renderIcon);

        // Every screen in this app rebuilds its markup with innerHTML, and a
        // caller that forgot to call refreshIcons used to leave a blank gap
        // where an icon should be. Watching the document upgrades icons however

        function upgradePending(root) {
          if (!root || root.nodeType !== 1) return;
          if (root.matches && root.matches('i[data-lucide]:not([data-icon-ready])')) renderIcon(root);
          if (!root.querySelectorAll) return;
          root.querySelectorAll('i[data-lucide]:not([data-icon-ready])').forEach(renderIcon);
        }
        function startIconObserver() {
          upgradePending(document.body);
          if (!window.MutationObserver || !document.body) return;
          new MutationObserver(function(records) {
            records.forEach(function(record) {
              if (record.type === 'attributes') {
                if (record.target.getAttribute('data-lucide')) {
                  record.target.removeAttribute('data-icon-ready');
                  renderIcon(record.target);
                }
                return;
              }
              record.addedNodes.forEach(upgradePending);
            });
          }).observe(document.body, {childList: true, subtree: true, attributes: true, attributeFilter: ['data-lucide']});

    <div id="appToasts" class="toast-stack" aria-live="polite" aria-atomic="false"></div>
    <script>
      let appToastSequence = 0;
      window.showAppToast = function(message, type, title, options) {
        const stack = document.getElementById('appToasts');
        if (!stack || !message) return '';
        options = options || {};
        const toastId = 'app-toast-' + (++appToastSequence);
        const toast = document.createElement('div');
        const icon = type === 'loading' ? '' : type === 'error' ? 'circle-alert' : type === 'warning' ? 'triangle-alert' : type === 'success' ? 'circle-check' : 'circle-info';
        toast.id = toastId;
        toast.className = 'app-toast toast-' + (type || 'info');
        toast.setAttribute('role', type === 'error' ? 'alert' : 'status');
        const mark = document.createElement('i');
        mark.setAttribute('aria-hidden', 'true');
        if (type === 'loading') {
          const spinner = document.createElement('span');
          spinner.className = 'toast-spinner';
          spinner.setAttribute('aria-hidden', 'true');
          mark.appendChild(spinner);
        } else {
          mark.setAttribute('data-lucide', icon);
        }
        const content = document.createElement('div');
        const heading = document.createElement('strong');
        heading.textContent = title || (type === 'error' ? 'Action failed' : type === 'warning' ? 'Needs attention' : type === 'success' ? 'Done' : 'Update');
        const detail = document.createElement('span');
        detail.textContent = String(message);
        content.append(heading, detail);
        const close = document.createElement('button');
        close.type = 'button';
        close.className = 'toast-close';
        close.setAttribute('aria-label', 'Dismiss notification');
        close.textContent = '×';
        close.hidden = options.persistent === true;
        close.addEventListener('click', function() { toast.remove(); });
        toast.append(mark, content, close);
        stack.appendChild(toast);
        if (icon && window.refreshIcons) window.refreshIcons(toast);
        if (options.persistent !== true) {
          let timer = window.setTimeout(function() { toast.remove(); }, 6500);
          toast.addEventListener('mouseenter', function() { window.clearTimeout(timer); });
          toast.addEventListener('mouseleave', function() { timer = window.setTimeout(function() { toast.remove(); }, 2500); });
        }
        return toastId;
      };
      window.dismissAppToast = function(toastId) {
        const toast = toastId && document.getElementById(toastId);
        if (toast) toast.remove();
      };
    </script>

      <form method="dialog">
        <h2 id="appConfirmTitle">Confirm action</h2>
        <p id="appConfirmMessage"></p>
        <div class="button-row">
          <button class="btn btn-outline-secondary" value="cancel">Cancel</button>
          <button id="appConfirmSubmit" class="btn btn-primary" value="confirm">Confirm</button>
        </div>
      </form>
    </dialog>
    <dialog id="appFormDialog" class="form-dialog" aria-labelledby="appFormTitle">
      <form method="dialog">
        <div class="form-dialog-head">
          <div>
            <h2 id="appFormTitle">Edit</h2>
            <p id="appFormDescription" class="muted"></p>
          </div>
          <button type="submit" class="form-dialog-close" value="cancel" aria-label="Close without saving">
            <i data-lucide="x"></i>
          </button>
        </div>
        <div id="appFormBody" class="form-dialog-body"></div>
        <div id="appFormError" class="form-dialog-error" hidden role="alert"></div>
        <div class="button-row">
          <button type="submit" class="btn btn-outline-secondary" value="cancel">Cancel</button>
          <button type="submit" id="appFormSubmit" class="btn btn-primary" value="confirm">Save changes</button>
        </div>
      </form>
    </dialog>
    <script>
      /**
       * Opens a modal containing caller-supplied form markup and resolves to the
       * values the caller asks for. `fields` maps a result key to the element id
       * inside the modal, so the caller never has to reach into the dialog.
       */
      window.openFormModal = function(options) {
        options = options || {};
        const dialog = document.getElementById('appFormDialog');
        const body = document.getElementById('appFormBody');
        const errorBox = document.getElementById('appFormError');
        const submit = document.getElementById('appFormSubmit');
        document.getElementById('appFormTitle').textContent = options.title || 'Edit';
        const description = document.getElementById('appFormDescription');
        description.textContent = options.description || '';
        description.hidden = !options.description;
        submit.textContent = options.confirmText || 'Save changes';
        submit.classList.toggle('danger', options.danger === true);
        submit.classList.toggle('btn-primary', options.danger !== true);
        body.innerHTML = options.bodyHtml || '';
        errorBox.hidden = true;
        errorBox.textContent = '';

        function readValues() {
          const values = {};
          Object.keys(options.fields || {}).forEach(function(key) {
            const field = document.getElementById(options.fields[key]);
            values[key] = field ? field.value : '';
          });
          return values;
        }

        return new Promise(function(resolve) {
          function onClose() {
            if (dialog.returnValue !== 'confirm') { cleanup(); resolve(null); return; }
            const values = readValues();
            // A validator can refuse the save and reopen with the message shown.
            const problem = options.validate ? options.validate(values) : '';
            if (problem) {
              errorBox.textContent = problem;
              errorBox.hidden = false;
              dialog.addEventListener('close', onClose, {once: true});
              dialog.showModal();
              return;
            }
            cleanup();
            resolve(values);
          }
          function cleanup() { dialog.removeEventListener('close', onClose); }
          dialog.addEventListener('close', onClose, {once: true});
          dialog.showModal();
          if (typeof options.onOpen === 'function') options.onOpen();
          const first = body.querySelector('input, select, textarea');
          if (first) first.focus();
        });
      };

      window.confirmAppAction = function(options) {
        const dialog = document.getElementById('appConfirmDialog');
        const submit = document.getElementById('appConfirmSubmit');
        document.getElementById('appConfirmTitle').textContent = options.title || 'Confirm action';
        document.getElementById('appConfirmMessage').textContent = options.message || 'Continue with this action?';
        submit.textContent = options.confirmText || 'Confirm';
        submit.classList.toggle('danger', options.danger === true);
        submit.classList.toggle('btn-primary', options.danger !== true);
        return new Promise(function(resolve) {
          dialog.addEventListener('close', function() {
            resolve(dialog.returnValue === 'confirm');
          }, {once:true});
          dialog.showModal();
        });
      };
      (function() {
        const canonicalUrl = document.body.getAttribute('data-canonical-url');
        if (!canonicalUrl) return;
        try {
          const target = new URL(canonicalUrl);
          const current = new URL(window.location.href);
          if (target.origin !== current.origin || target.pathname !== current.pathname) return;
          target.hash = current.hash;
          if (target.href !== current.href) window.location.replace(target.href);
        } catch (error) {
          console.error('Unable to normalize this application URL.', error);
        }
      })();
    </script>
