<div id="login" class="card"><h2>Moving Surface ERP</h2><p class="muted">Select your linked staff account, then enter its four-digit admin PIN.</p><label for="adminStaffId">Staff account</label><select id="adminStaffId" disabled><option>Loading authorized accounts…</option></select><label for="pin">Four-digit PIN</label><input id="pin" type="password" inputmode="numeric" autocomplete="current-password" maxlength="4" pattern="[0-9]{4}" placeholder="0000"><button class="green" onclick="login()">Login</button><div id="msg" class="msg"></div></div>
<div id="app" class="app hidden">
  <aside class="side"><div class="logo">Moving Surface ERP<span id="roleText"></span></div>
    <button class="navbtn active" data-page="dashboard" onclick="showTab('dashboard',this)"><i data-lucide="layout-dashboard"></i> Dashboard</button>
    <button class="navbtn" data-page="attendance" onclick="showTab('attendance',this)"><i data-lucide="calendar-check"></i> Attendance</button>
    <button class="navbtn" data-page="staff" onclick="showTab('staff',this)"><i data-lucide="users-round"></i> Staff</button>
    <button class="navbtn" data-page="requisitions" onclick="showTab('requisitions',this)"><i data-lucide="shopping-cart"></i> Requisitions</button>
    <button class="navbtn" data-page="inventory" onclick="showTab('inventory',this)"><i data-lucide="boxes"></i> Inventory</button>
    <button class="navbtn" data-page="assets" onclick="showTab('assets',this)"><i data-lucide="laptop"></i> Assets</button>
    <button class="navbtn" data-page="expenses" onclick="showTab('expenses',this)"><i data-lucide="receipt"></i> Expense Claims</button>
    <button class="navbtn" data-page="leave" onclick="showTab('leave',this)"><i data-lucide="tree-deciduous"></i> Leave</button>
    <button class="navbtn" data-page="projects" onclick="showTab('projects',this)"><i data-lucide="folder-kanban"></i> Projects</button>
    <button class="navbtn" data-page="leads" onclick="showTab('leads',this)"><i data-lucide="handshake"></i> Leads</button>
    <button class="navbtn" data-page="reports" onclick="showTab('reports',this)"><i data-lucide="chart-no-axes-column"></i> Reports</button>
    <button class="navbtn" data-page="activity" onclick="showTab('activity',this)"><i data-lucide="clipboard-list"></i> Activity log</button>
    <button class="navbtn" data-page="users" onclick="showTab('users',this)" hidden><i data-lucide="users-round"></i> Users</button>
    <button class="navbtn" onclick="logout()"><i data-lucide="log-out"></i> Logout</button>
  </aside>
  <main class="main">
    <div class="top card"><div><h2 style="margin:0">Moving Surface ERP</h2><div class="muted" id="welcome"></div></div><div class="toolbar-search"><label class="visually-hidden" for="globalSearch">Search dashboard information</label><input id="globalSearch" type="search" placeholder="Search staff, requests, inventory..." oninput="queueDashboardSearch(this.value)"><button class="smallbtn gray" onclick="refresh()">Refresh</button></div></div>
    <div id="globalSearchResults" class="card search-results hidden"></div>
    <div id="globalMsg" class="msg"></div>
    <section id="tab_dashboard"></section>
    <section id="tab_attendance" class="hidden"></section>
    <section id="tab_staff" class="hidden"></section>
    <section id="tab_requisitions" class="hidden"></section>
    <section id="tab_inventory" class="hidden"></section>
    <section id="tab_assets" class="hidden"></section>
    <section id="tab_expenses" class="hidden"></section>
    <section id="tab_leave" class="hidden"></section>
    <section id="tab_projects" class="hidden"></section>
    <section id="tab_leads" class="hidden"></section>
    <section id="tab_reports" class="hidden"></section>
    <section id="tab_activity" class="hidden"></section>
    <section id="tab_users" class="hidden"></section>
  </main>
</div>
<script>
let currentPin='', adminStaffId='', D=null, activeOperationToast='', userManagementData=null, userAccessMode='create';
// The page the user is on. A data reload re-renders every page, so without this
// the portal used to drop them back on the dashboard after every single action.
let activePage='dashboard';
document.getElementById('pin').addEventListener('input',function(){this.value=this.value.replace(/\D/g,'').slice(0,4);});
function loadAdminLoginOptions(){google.script.run.withSuccessHandler(function(options){const select=document.getElementById('adminStaffId');select.innerHTML='';if(!options.length){select.innerHTML='<option value="">No linked admin accounts found</option>';msg('Ask an administrator to map your Staff ID in Admin Users before signing in.','bad');select.disabled=true;return;}options.forEach(function(option){const item=document.createElement('option');item.value=option.staffId;item.textContent=option.staffId+' — '+option.name;select.appendChild(item);});select.disabled=false;}).withFailureHandler(function(error){const select=document.getElementById('adminStaffId');select.innerHTML='<option value="">Accounts unavailable</option>';select.disabled=true;msg('Admin accounts could not be loaded: '+(error.message||error),'bad');}).getAdminLoginOptions();}
loadAdminLoginOptions();
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function money(n){return 'NGN '+Number(n||0).toLocaleString('en-NG');}
function msg(text,cls,id){const el=document.getElementById(id||'msg');el.style.display='block';el.className='msg '+cls;el.textContent=text;}
function finishOperationToast(){if(activeOperationToast){window.dismissAppToast(activeOperationToast);activeOperationToast='';}}
function gmsg(text,cls){const el=document.getElementById('globalMsg');el.style.display='none';if(cls==='wait'){finishOperationToast();activeOperationToast=window.showAppToast(String(text),'loading','Moving Surface ERP',{persistent:true});return;}finishOperationToast();if(cls==='bad'){window.showAppToast(String(text),'error','Action failed');return;}if(cls==='ok'&&String(text)!=='Loaded successfully'){const value=String(text),queued=/\bqueued\b/i.test(value);window.showAppToast(value,queued?'info':'success',queued?'Notification queued':'Update complete');}}
function loadingMarkup(text){return '<div class="inline-loader" role="status"><span class="inline-spinner" aria-hidden="true"></span>'+esc(text)+'</div>';}
function login(){activePage='dashboard';const pin=document.getElementById('pin').value.trim();adminStaffId=val('adminStaffId').trim();if(!adminStaffId){msg('Select your linked staff account.','bad');return;}if(!/^\d{4}$/.test(pin)){msg('Enter all four PIN digits, including any leading zero.','bad');return;}currentPin=pin+'|'+adminStaffId;gmsg('Signing in…','wait');google.script.run.withSuccessHandler(function(result){render(result);if(result&&result.success){window.showAppToast('Welcome back, '+result.user.name+'.','success','Signed in');notifyAdminInbox(result);}}).withFailureHandler(e=>gmsg('Sign-in failed: '+(e.message||e),'bad')).adminGetPortalData({adminPin:currentPin,logSignIn:true});}
function notifyAdminInbox(data){const pending=data.summary.pendingReq||0,expenses=(data.expenses||[]).filter(row=>row.status==='Pending Approval').length,accounts=data.summary.awaitingAccounts||0;if(pending)window.showAppToast(pending+' requisition'+(pending===1?'':'s')+' awaiting approval.','warning','Approval queue');if(expenses)window.showAppToast(expenses+' expense claim'+(expenses===1?'':'s')+' awaiting review.','warning','Expense claims');if(accounts)window.showAppToast(accounts+' approved requisition'+(accounts===1?'':'s')+' awaiting accounts.','info','Accounts queue');}
function logout(){window.confirmAppAction({title:'Log out of the admin portal?',message:'You will need to sign in again to continue.',confirmText:'Log out',danger:true}).then(confirmed=>{if(!confirmed)return;currentPin='';adminStaffId='';D=null;document.getElementById('pin').value='';document.getElementById('app').className='app hidden';document.getElementById('login').className='card';});}
function refresh(){if(!currentPin)return;const scrollY=window.scrollY;gmsg('Refreshing...','wait');google.script.run.withSuccessHandler(function(res){render(res);window.scrollTo(0,scrollY);}).withFailureHandler(e=>gmsg('Script error: '+(e.message||e),'bad')).adminGetPortalData({adminPin:currentPin});}
function render(res){finishOperationToast();if(!res||!res.success){gmsg((res&&res.message)||'Login failed.','bad');return;}D=res;userManagementData=null;document.getElementById('login').className='card hidden';document.getElementById('app').className='app';document.getElementById('roleText').textContent=res.user.name+' | '+res.user.role;document.getElementById('welcome').textContent='Welcome '+res.user.name+' | '+new Date().toLocaleString();applyPortalPermissions();drawAll();loadPageData(activePage);}
function applyPortalPermissions(){document.querySelectorAll('.navbtn[data-page]').forEach(button=>{button.hidden=!D.user.access.readPages.includes(button.dataset.page);});document.querySelectorAll('main section[id^="tab_"]').forEach(section=>{const page=section.id.slice(4);section.hidden=!D.user.access.readPages.includes(page);});}
function showTab(name,btn){if(!D||!D.user.access.readPages.includes(name)){gmsg('You do not have access to this page.','bad');return;}if(name!==activePage)clearPageFilters();activePage=name;document.querySelectorAll('main section').forEach(s=>s.classList.add('hidden'));const section=document.getElementById('tab_'+name);section.hidden=false;section.classList.remove('hidden');document.querySelectorAll('.navbtn').forEach(b=>b.classList.remove('active'));if(btn)btn.classList.add('active');loadPageData(name);}
/** Side-effect loads a page needs when it becomes visible. */
function loadPageData(name){attendanceActive=name==='attendance';if(attendanceActive)loadAttendancePage(1);if(name==='reports')loadAnalytics();if(name==='activity')loadActivityPage(1);if(name==='users')loadUserManagement();}
function clearPageFilters(){['staffSearch','staffStatusFilter','attendanceSearch','attendanceFrom','attendanceTo','attendanceAction','attendanceSort','activitySearch','activityFrom','activityTo','activityAction','activitySort','reportFrom','reportTo','globalSearch'].forEach(id=>{const field=document.getElementById(id);if(field)field.value='';});const preset=document.getElementById('attendancePreset');if(preset)preset.value='all';clearTimeout(attendanceTimer);clearTimeout(dashboardSearchTimer);const results=document.getElementById('globalSearchResults');if(results){results.innerHTML='';results.classList.add('hidden');}}
function kpi(title,value,note){return '<div class="kpi"><b>'+esc(value)+'</b>'+esc(title)+'<div class="muted">'+esc(note||'')+'</div></div>';}
function drawAll(){drawDashboard();if(D.user.access.readPages.includes('attendance'))drawAttendance();if(D.user.access.readPages.includes('staff'))drawStaff();if(D.user.access.readPages.includes('requisitions'))drawRequisitions(reqPage);if(D.user.access.readPages.includes('inventory'))drawInventory();if(D.user.access.readPages.includes('assets'))drawAssets();if(D.user.access.readPages.includes('expenses'))drawExpenses();if(D.user.access.readPages.includes('leave'))drawLeave();if(D.user.access.readPages.includes('projects'))drawProjects();if(D.user.access.readPages.includes('leads'))drawLeads();if(D.user.access.readPages.includes('reports')){drawReports();if(D.user.access.readPages.includes('staff'))drawStaffReportSearch();}if(D.user.access.readPages.includes('activity'))drawActivity();document.querySelectorAll('main section').forEach(section=>section.classList.add('hidden'));document.querySelectorAll('main section').forEach(section=>{section.hidden=!D.user.access.readPages.includes(section.id.slice(4));});restoreActivePage();}
/**
 * Shows the page the user was on before the reload, falling back to the
 * dashboard only when that page is gone or they can no longer read it.
 */
function restoreActivePage(){const wanted=D.user.access.readPages.includes(activePage)&&document.getElementById('tab_'+activePage)?activePage:'dashboard';activePage=wanted;const section=document.getElementById('tab_'+wanted);if(section){section.hidden=false;section.classList.remove('hidden');}document.querySelectorAll('.navbtn').forEach(button=>button.classList.toggle('active',button.dataset.page===wanted));}
let hotspotIndex=0;
function drawDashboard(){const s=D.summary;D.hotspots=buildHotspots();hotspotIndex=0;const metrics=[['staff','Active Staff',s.activeStaff,'Staff List'],['attendance','Currently In',s.signedIn,'Today'],['attendance','Overtime Days',s.overtimeDays,'Current month'],['requisitions','Pending Requisitions',s.pendingReq,'Needs MD'],['requisitions','Awaiting Accounts',s.awaitingAccounts,'Approved requests'],['expenses','Open Expenses',s.openExpenses,'Claims'],['assets','Assets Assigned',s.assetsAssigned,'Asset register'],['inventory','Low Stock Items',s.lowStock,'Inventory'],['projects','Active Projects',s.activeProjects,'Projects'],['projects','Project Balance',money(s.projectBalance),'Contract value less spend'],['projects','Receivable',money(s.projectReceivable),'Invoiced less received'],['leads','Open Leads',s.openLeads,'Still in play'],['leads','Weighted Pipeline',money(s.weightedPipeline),'Value x probability'],['leads','Overdue Follow-ups',s.overdueFollowups,'Past their date']].filter(item=>D.user.access.readPages.includes(item[0])).map(item=>kpi(item[1],item[2],item[3])).join('');let html='<div class="dashboard-hero"><div><h1>Today’s work, in focus.</h1><p>Review the activity that needs attention, then move straight to the right register.</p></div><div id="hotspotSlider" class="hotspot-slider" aria-label="Operational hotspots"></div></div><div class="grid">'+metrics+'</div><div class="dashboard-lower"><div class="card"><h3>Quick links</h3><p class="muted">Open a portal directly using its route.</p><div class="dashboard-links">'+(D.user.access.readPages.includes('attendance')?'<a href="'+esc(D.webAppUrl||'#')+'" target="_blank" rel="noopener">Attendance</a>':'')+(D.user.access.readPages.includes('staff')?'<a href="'+esc((D.webAppUrl||'#')+'?staff=1')+'" target="_blank" rel="noopener">Staff portal</a>':'')+(D.user.access.readPages.includes('requisitions')?'<a href="'+esc((D.webAppUrl||'#')+'?req=1')+'" target="_blank" rel="noopener">Requisition portal</a>':'')+'</div></div><div class="card"><h3>At a glance</h3><p class="muted">Use the hotspot controls to move between the operational pages available to you.</p></div></div>';document.getElementById('tab_dashboard').innerHTML=html;renderHotspot();}
function buildHotspots(){const requisitions=(D.requisitions||[]).filter(row=>row.status==='Pending MD Approval'),urgent=requisitions.filter(row=>String(row.priority||'').toLowerCase()==='urgent'),expenses=(D.expenses||[]).filter(row=>row.status==='Pending Approval'),awaitingAccounts=(D.requisitions||[]).filter(row=>row.status==='Approved - Awaiting Accounts'),lowStock=(D.inventory||[]).filter(row=>row.stockStatus==='Low Stock'),items=[];if(urgent.length)items.push({level:'critical',label:'Urgent',icon:'triangle-alert',title:'Urgent requisitions',detail:urgent.length+' request'+(urgent.length===1?'':'s')+' marked urgent need a decision.',tab:'requisitions',cta:'Review requests'});else if(requisitions.length)items.push({level:'high',label:'High priority',icon:'shopping-cart',title:'Requisitions to review',detail:requisitions.length+' request'+(requisitions.length===1?'':'s')+' are waiting for approval.',tab:'requisitions',cta:'Review requests'});if(expenses.length)items.push({level:'warning',label:'Needs review',icon:'receipt',title:'Expense claims',detail:expenses.length+' claim'+(expenses.length===1?'':'s')+' are waiting for review.',tab:'expenses',cta:'Review claims'});if(awaitingAccounts.length)items.push({level:'info',label:'Accounts',icon:'circle-info',title:'Approved, awaiting accounts',detail:awaitingAccounts.length+' requisition'+(awaitingAccounts.length===1?'':'s')+' need accounts processing.',tab:'requisitions',cta:'Open requisitions'});if(lowStock.length)items.push({level:'warning',label:'Stock alert',icon:'boxes',title:'Low inventory',detail:lowStock.length+' item'+(lowStock.length===1?'':'s')+' at or below reorder level.',tab:'inventory',cta:'Check inventory'});const overdueLeads=(D.leads||[]).filter(row=>row.followupOverdue),dueSoonLeads=(D.leads||[]).filter(row=>row.followupDueSoon),overBudget=(D.projects||[]).filter(row=>row.overBudget);if(overdueLeads.length)items.push({level:'critical',label:'Overdue',icon:'triangle-alert',title:'Follow-ups past their date',detail:overdueLeads.length+' lead'+(overdueLeads.length===1?'':'s')+' were scheduled for follow-up and never logged.',tab:'leads',cta:'Open leads'});else if(dueSoonLeads.length)items.push({level:'high',label:'Due soon',icon:'handshake',title:'Follow-ups due within 3 days',detail:dueSoonLeads.length+' lead'+(dueSoonLeads.length===1?'':'s')+' need contact this week.',tab:'leads',cta:'Open leads'});if(overBudget.length)items.push({level:'critical',label:'Over budget',icon:'triangle-alert',title:'Projects over their budget',detail:overBudget.length+' project'+(overBudget.length===1?'':'s')+' have spent more than the approved expenditure budget.',tab:'projects',cta:'Review projects'});return items.length?items:[{level:'info',label:'All clear',icon:'circle-check',title:'No urgent actions',detail:'No approvals, expense claims, or low-stock alerts need attention right now.',tab:'dashboard',cta:'View dashboard'}];}
function renderHotspot(){const root=document.getElementById('hotspotSlider');if(!root)return;const items=D.hotspots||[],item=items[hotspotIndex]||items[0];root.innerHTML='<div class="hotspot-topline"><span>Priority activity</span><span class="hotspot-priority priority-'+esc(item.level)+'"><i data-lucide="'+esc(item.icon)+'"></i>'+esc(item.label)+'</span></div><div class="hotspot-content" aria-live="polite"><div class="hotspot-icon hotspot-'+esc(item.level)+'"><i data-lucide="'+esc(item.icon)+'"></i></div><div class="hotspot-copy"><h3>'+esc(item.title)+'</h3><p>'+esc(item.detail)+'</p></div></div><div class="hotspot-controls"><button type="button" aria-label="Previous hotspot" onclick="moveHotspot(-1)" '+(items.length<2?'disabled':'')+'><i data-lucide="chevron-left"></i></button><button type="button" class="hotspot-cta" onclick="openHotspot(\''+esc(item.tab)+'\')">'+esc(item.cta)+'</button><span class="hotspot-step">'+(hotspotIndex+1)+' / '+items.length+'</span><button type="button" aria-label="Next hotspot" onclick="moveHotspot(1)" '+(items.length<2?'disabled':'')+'><i data-lucide="chevron-right"></i></button></div>';refreshIcons(root);}
function openHotspot(tab){const button=Array.from(document.querySelectorAll('.navbtn')).find(item=>(item.getAttribute('onclick')||'').includes("'"+tab+"'"));showTab(tab,button);}
function moveHotspot(offset){const count=(D.hotspots||[]).length;if(count<2)return;hotspotIndex=(hotspotIndex+offset+count)%count;renderHotspot();}
let attendanceState={page:1,pageSize:25,total:0,totalPages:0}, activityState={page:1,pageSize:25,total:0,totalPages:0}, attendanceTimer=null, attendanceActive=false;
function localDateKey(date){return [date.getFullYear(),String(date.getMonth()+1).padStart(2,'0'),String(date.getDate()).padStart(2,'0')].join('-');}
function setAttendancePreset(){const preset=val('attendancePreset'),today=new Date(),from=new Date(today),to=new Date(today);if(preset==='yesterday'){from.setDate(today.getDate()-1);to.setDate(today.getDate()-1);}else if(preset==='last7'){from.setDate(today.getDate()-6);}else if(preset==='lastWeek'){const day=(today.getDay()+6)%7;from.setDate(today.getDate()-day-7);to.setDate(today.getDate()-day-1);}else if(preset==='lastMonth'){from.setDate(1);from.setMonth(from.getMonth()-1);to.setDate(0);}else if(preset==='all'){document.getElementById('attendanceFrom').value='';document.getElementById('attendanceTo').value='';if(attendanceActive)loadAttendancePage(1);return;}document.getElementById('attendanceFrom').value=localDateKey(from);document.getElementById('attendanceTo').value=localDateKey(to);if(attendanceActive)loadAttendancePage(1);}
function drawAttendance(){const a=D.liveAttendance;document.getElementById('tab_attendance').innerHTML='<div class="grid">'+kpi('Active staff',a.totalStaff,a.date)+kpi('Currently in',a.signedInCount,a.currentTime)+kpi('Checked out',a.checkedOutCount,'Selected day')+kpi('Overtime checkouts',a.overtimeCheckoutCount,'Selected day')+kpi('Not signed in',a.notSignedInCount,'Selected day')+'</div><div class="card"><div class="section-title"><div><h3>Attendance history</h3><p class="muted">Search check-ins and check-outs, then narrow the date range.</p></div><a class="sheet-link" id="attendanceSheetLink" target="_blank" rel="noopener">Open attendance sheet</a></div><div class="filter-grid"><div><label for="attendancePreset">Date range</label><select id="attendancePreset" onchange="setAttendancePreset()"><option value="today">Today</option><option value="yesterday">Yesterday</option><option value="last7">Last 7 days</option><option value="lastWeek">Last week</option><option value="lastMonth">Last month</option><option value="all">All dates</option><option value="custom">Custom range</option></select></div><div><label for="attendanceFrom">From</label><input id="attendanceFrom" type="date" onchange="attendanceCustomRange()"></div><div><label for="attendanceTo">To</label><input id="attendanceTo" type="date" onchange="attendanceCustomRange()"></div><div><label for="attendanceAction">Action</label><select id="attendanceAction" onchange="loadAttendancePage(1)"><option value="">All actions</option><option>Check In</option><option>Check Out</option><option>Check Out Overtime</option></select></div><div><label for="attendanceSort">Sort by date</label><select id="attendanceSort" onchange="loadAttendancePage(1)"><option value="newest">Newest first</option><option value="oldest">Oldest first</option></select></div></div><div class="toolbar-search"><label class="visually-hidden" for="attendanceSearch">Search attendance</label><input id="attendanceSearch" type="search" placeholder="Search staff, department, status..." oninput="queueAttendanceSearch()"><button class="smallbtn gray" onclick="loadAttendancePage(1)">Search</button></div><div id="attendanceResults" class="tablewrap"></div><div id="attendancePager" class="pager"></div></div>';const link=document.getElementById('attendanceSheetLink');link.href=sheetLink('Attendance Log');setAttendancePreset();}
function attendanceCustomRange(){document.getElementById('attendancePreset').value='custom';loadAttendancePage(1);}
function queueAttendanceSearch(){clearTimeout(attendanceTimer);attendanceTimer=setTimeout(()=>loadAttendancePage(1),250);}
function loadAttendancePage(page){if(!currentPin||!document.getElementById('attendanceResults'))return;const payload={adminPin:currentPin,page:page,from:val('attendanceFrom'),to:val('attendanceTo'),action:val('attendanceAction'),sort:val('attendanceSort'),query:val('attendanceSearch')};document.getElementById('attendanceResults').innerHTML=loadingMarkup('Loading attendance records…');google.script.run.withSuccessHandler(renderAttendancePage).withFailureHandler(e=>{document.getElementById('attendanceResults').innerHTML='<p class="empty-state" role="alert">Attendance records could not be loaded. Try changing the filters or search again.</p>';gmsg('Attendance could not be loaded: '+(e.message||e),'bad');}).adminGetAttendancePage(payload);}
function renderAttendancePage(res){if(!res||!res.success){document.getElementById('attendanceResults').innerHTML='<p class="empty-state" role="alert">Attendance records could not be loaded. Try changing the filters or search again.</p>';gmsg((res&&res.message)||'Attendance could not be loaded.','bad');return;}attendanceState=res;let html='<table><thead><tr><th>Date & time</th><th>Staff</th><th>Department</th><th>Action</th><th>Checkout time</th><th>Checkout type</th><th>Status</th><th>Location</th><th>Distance</th></tr></thead><tbody>';if(!res.rows.length)html+='<tr><td colspan="9">No attendance records match these filters.</td></tr>';res.rows.forEach(r=>{html+='<tr><td>'+esc(r.timestamp)+'</td><td>'+esc(r.staffName)+'<br><span class="muted">'+esc(r.staffId)+'</span></td><td>'+esc(r.department)+'</td><td>'+esc(r.action)+'</td><td>'+esc(r.checkoutTime||'—')+'</td><td>'+esc(r.checkoutType||'—')+'</td><td>'+esc(r.status)+'</td><td>'+esc(r.matchedLocation||r.location)+'<br><span class="muted">'+esc(r.gpsStatus)+'</span></td><td>'+esc(r.distance)+' m</td></tr>';});html+='</tbody></table>';document.getElementById('attendanceResults').innerHTML=html;document.getElementById('attendancePager').innerHTML=pagerHtml(res,'attendance');}
function drawStaff(){let html='<div class="card"><div class="section-title"><div><h3>Staff records</h3><p class="muted">Changes are written directly to Staff List. PINs and device tokens are not shown or edited here.</p></div><select id="staffStatusFilter" class="compact-select" onchange="filterStaffRows()"><option value="">All statuses</option><option>Active</option><option>Inactive</option></select></div><div class="toolbar-search"><label class="visually-hidden" for="staffSearch">Search staff</label><input id="staffSearch" type="search" placeholder="Search staff ID, name, department..." oninput="filterStaffRows()"></div><div class="tablewrap"><table id="staffTable"><thead><tr><th>ID / Name</th><th>Department</th><th>Location</th><th>Company email</th><th>Salary</th><th>PIN / device</th><th>Status</th><th>Actions</th></tr></thead><tbody>';D.staff.forEach(s=>{html+='<tr data-staff-status="'+esc(s.status)+'"><td>'+esc(s.id)+'<br><b>'+esc(s.name)+'</b><br><span class="muted">'+esc(s.designation)+'</span></td><td>'+esc(s.department)+'</td><td>'+esc(s.location)+'</td><td>'+esc(s.companyEmail)+'</td><td>'+money(s.monthlySalary)+'</td><td>'+esc(s.pinSet)+' / '+esc(s.deviceSet)+'</td><td><span class="pill">'+esc(s.status)+'</span></td><td class="action-cell">';if(D.user.canOnboard==='YES')html+='<button class="smallbtn secondary" data-staff-action="edit" data-staff-id="'+esc(s.id)+'">Edit</button><button class="smallbtn '+(s.status==='Active'?'danger':'green')+'" data-staff-action="status" data-staff-id="'+esc(s.id)+'" data-status="'+(s.status==='Active'?'Inactive':'Active')+'">'+(s.status==='Active'?'Disable':'Reactivate')+'</button><button class="smallbtn danger" data-staff-action="delete" data-staff-id="'+esc(s.id)+'">Delete</button>';html+='</td></tr>';});html+='</tbody></table></div></div>';if(D.user.canOnboard==='YES')html+=staffForm(null);if(D.user.canReset==='YES')html+=resetForm();document.getElementById('tab_staff').innerHTML=html;document.querySelectorAll('[data /*************** INVENTORY ***************/
/**
 * Unit and Opening Stock are different things and the old screen showed
 * neither, which is what made them look like duplicates:
 *   Unit          - the noun a quantity is counted in (pcs, roll, metre).
 *   Opening Stock - the starting number on hand when the item was recorded.
 * The table below shows the full arithmetic, Opening + In - Out = Current,
 * with the unit beside it, so the relationship is visible rather than implied.
 */
let inventoryImportRows=null;
function placeholderOption(label){return '<option value="" disabled selected>'+esc(label)+'</option>';}
/** A select whose first entry is a real placeholder: visible, never submitted. */
function pickerOptions(values,selected,placeholder){const chosen=String(selected==null?'':selected);return (chosen?'':placeholderOption(placeholder||'Select…'))+(values||[]).map(v=>'<option'+(String(v)===chosen?' selected':'')+'>'+esc(v)+'</option>').join('');}
function stockPill(r){return '<span class="pill '+(r.lowStock?'pill-warn':'pill-ok')+'">'+esc(r.stockStatus||(r.lowStock?'Low Stock':'OK'))+'</span>';}
function drawInventory(){const canWrite=D.user.access.writePages.includes('inventory');const items=D.inventory||[];const low=items.filter(r=>r.lowStock).length;
let html='<div class="grid">'+kpi('Items tracked',items.length,'In the register')+kpi('Low stock',low,'At or below reorder level')+kpi('Units on hand',items.reduce((sum,r)=>sum+Number(r.currentStock||0),0),'Across all items')+'</div>';
html+='<div class="card"><div class="section-title"><div><h3>Inventory</h3><p class="muted">Quantity-tracked stock. <b>Unit</b> is what a quantity is counted in; <b>Opening</b> is the number on hand when the item was first recorded. Current stock is always Opening + In &minus; Out.</p></div><a class="sheet-link" href="'+esc(sheetLink('Inventory Items')||'#')+'" target="_blank" rel="noopener">Open inventory sheet</a></div>';
html+='<div class="tablewrap"><table><tr><th>ID</th><th>Item</th><th>Category</th><th>Unit</th><th class="num">Opening</th><th class="num">In</th><th class="num">Out</th><th class="num">Current</th><th class="num">Reorder</th><th>Status</th><th>Location</th>'+(canWrite?'<th>Actions</th>':'')+'</tr>';
if(!items.length)html+='<tr><td colspan="'+(canWrite?12:11)+'" class="empty-state">No inventory items yet. Add one below, or import a CSV.</td></tr>';
items.forEach(r=>{html+='<tr><td>'+esc(r.itemId)+'</td><td>'+esc(r.itemName)+'</td><td>'+esc(r.category||'-')+'</td><td>'+esc(r.unit||'-')+'</td><td class="num">'+esc(r.openingStock)+'</td><td class="num">'+esc(r.stockIn)+'</td><td class="num">'+esc(r.stockOut)+'</td><td class="num"><b>'+esc(r.currentStock)+'</b></td><td class="num">'+esc(r.reorderLevel)+'</td><td>'+stockPill(r)+'</td><td>'+esc(r.location||'-')+'</td>';
if(canWrite)html+='<td><div class="row-actions"><button class="smallbtn gray" onclick="editInventoryItem(\''+esc(r.itemId)+'\')"><i data-lucide="pencil"></i> Edit</button><button class="smallbtn danger" onclick="deleteInventoryItem(\''+esc(r.itemId)+'\')"><i data-lucide="trash-2"></i> Delete</button></div></td>';
html+='</tr>';});
html+='</table></div></div>';
html+=canWrite?inventoryForms()+inventoryImportCard()+inventoryImportInfo():'<p class="muted">You have view-only access to inventory.</p>'+inventoryImportInfo();
document.getElementById('tab_inventory').innerHTML=html;}
function inventoryForms(){const cats=D.inventoryRefData&&D.inventoryRefData.categories||[];const units=D.inventoryRefData&&D.inventoryRefData.units||[];const types=D.inventoryRefData&&D.inventoryRefData.transactionTypes||[];
return '<div class="two"><div class="card"><h3>Add Inventory Item</h3><label for="invName">Item name</label><input id="invName" placeholder="HDMI cable 10m"><label for="invCat">Category</label><select id="invCat">'+pickerOptions(cats,'','Select a category…')+'</select><label for="invUnit">Unit of measure</label><select id="invUnit">'+pickerOptions(units,'','Select a unit…')+'</select><span class="field-hint">What one of this item is counted in, for example pcs or roll.</span><label for="invOpen">Opening stock</label><input id="invOpen" type="number" min="0" step="1" placeholder="0"><span class="field-hint">How many you have on hand right now. This seeds the balance; later changes go through stock transactions.</span><label for="invReorder">Reorder level</label><input id="invReorder" type="number" min="0" step="1" placeholder="0"><span class="field-hint">Low Stock shows once the current stock drops to this number or below.</span><label for="invLoc">Location</label><input id="invLoc" placeholder="Abuja store"><label for="invVendor">Preferred vendor</label><input id="invVendor" placeholder="Optional"><button class="green" onclick="addInventory()"><i data-lucide="plus"></i> Add item</button></div>'+
'<div class="card"><h3>Stock Transaction</h3><p class="muted">Moves stock in or out. Adjustment restates the balance to match a physical count.</p><label for="txnItem">Item</label><select id="txnItem">'+placeholderOption('Select an item…')+D.inventoryOptions+'</select><label for="txnType">Type</label><select id="txnType">'+pickerOptions(types,'','Select a type…')+'</select><label for="txnQty">Quantity</label><input id="txnQty" type="number" min="1" step="1" placeholder="1"><label for="txnProject">Project / event</label><select id="txnProject">'+projectOptions('')+'</select><label for="txnRef">Reference</label><input id="txnRef" placeholder="Waybill or request number"><label for="txnNotes">Notes</label><textarea id="txnNotes" placeholder="Optional"></textarea><button class="green" onclick="postInventoryTxn()"><i data-lucide="arrow-down-up"></i> Post transaction</button></div></div>';}
function addInventory(){const p={adminPin:currentPin,itemName:val('invName'),category:val('invCat'),unit:val('invUnit'),openingStock:val('invOpen'),reorderLevel:val('invReorder'),location:val('invLoc'),preferredVendor:val('invVendor')};gmsg('Adding item...','wait');google.script.run.withSuccessHandler(r=>{gmsg(r.message,r.success?'ok':'bad');if(r.success)refresh();}).withFailureHandler(e=>gmsg('Script error: '+(e.message||e),'bad')).erpAddInventoryItem(p);}
function postInventoryTxn(){const p={adminPin:currentPin,itemId:val('txnItem'),type:val('txnType'),quantity:val('txnQty'),projectId:val('txnProject'),project:val('txnProject'),reference:val('txnRef'),notes:val('txnNotes')};gmsg('Posting stock transaction...','wait');google.script.run.withSuccessHandler(r=>{gmsg(r.message,r.success?'ok':'bad');if(r.success)refresh();}).withFailureHandler(e=>gmsg('Script error: '+(e.message||e),'bad')).erpPostInventoryTransaction(p);}

/*** Edit ***/
function editInventoryItem(itemId){const item=(D.inventory||[]).filter(r=>r.itemId===itemId)[0];if(!item){gmsg('That item is no longer in the register. Refresh and try again.','bad');return;}
const cats=D.inventoryRefData&&D.inventoryRefData.categories||[];const units=D.inventoryRefData&&D.inventoryRefData.units||[];
const body='<div class="two"><div><label for="editInvName">Item name</label><input id="editInvName" value="'+esc(item.itemName)+'"></div><div><label for="editInvCat">Category</label><select id="editInvCat">'+pickerOptions(cats,item.category,'Select a category…')+'</select></div><div><label for="editInvUnit">Unit of measure</label><select id="editInvUnit">'+pickerOptions(units,item.unit,'Select a unit…')+'</select></div><div><label for="editInvOpen">Opening stock</label><input id="editInvOpen" type="number" min="0" step="1" value="'+Number(item.openingStock)+'"></div><div><label for="editInvReorder">Reorder level</label><input id="editInvReorder" type="number" min="0" step="1" value="'+Number(item.reorderLevel)+'"></div><div><label for="editInvLoc">Location</label><input id="editInvLoc" value="'+esc(item.location)+'" placeholder="Abuja store"></div><div><label for="editInvVendor">Preferred vendor</label><input id="editInvVendor" value="'+esc(item.preferredVendor)+'" placeholder="Optional"></div></div><label for="editInvNotes">Notes</label><textarea id="editInvNotes" placeholder="Optional">'+esc(item.notes)+'</textarea>'+
'<div class="info-outline"><h4>Current stock: '+esc(item.currentStock)+' '+esc(item.unit||'')+'</h4><p>'+esc(item.openingStock)+' opening + '+esc(item.stockIn)+' in &minus; '+esc(item.stockOut)+' out. Editing the opening stock corrects the starting balance; to record a movement, post a stock transaction instead.</p></div>';
window.openFormModal({title:'Edit '+item.itemId,description:item.itemName,confirmText:'Save changes',bodyHtml:body,
fields:{itemName:'editInvName',category:'editInvCat',unit:'editInvUnit',openingStock:'editInvOpen',reorderLevel:'editInvReorder',location:'editInvLoc',preferredVendor:'editInvVendor',notes:'editInvNotes'},
validate:function(v){if(!String(v.itemName||'').trim())return 'Item name is required.';if(Number(v.openingStock)<0||Number(v.reorderLevel)<0)return 'Quantities cannot be negative.';return '';}})
.then(function(values){if(!values)return;const p=Object.assign({adminPin:currentPin,itemId:itemId},values);gmsg('Saving item...','wait');google.script.run.withSuccessHandler(r=>{gmsg(r.message,r.success?'ok':'bad');if(r.success)refresh();}).withFailureHandler(e=>gmsg('Script error: '+(e.message||e),'bad')).erpUpdateInventoryItem(p);});}

/*** Delete, always behind a confirmation ***/
function deleteInventoryItem(itemId){gmsg('Checking item history...','wait');google.script.run.withSuccessHandler(function(res){finishOperationToast();if(!res||!res.success){gmsg((res&&res.message)||'Item could not be read.','bad');return;}
const item=res.item,count=res.transactionCount;
const detail=item.itemName+' ('+item.itemId+') currently holds '+item.currentStock+' '+(item.unit||'units')+'.'+
(count?' It has '+count+' stock transaction'+(count===1?'':'s')+', which stay in the movement log for audit.':' It has no stock transactions.')+
' This cannot be undone.';
window.confirmAppAction({title:'Remove this inventory item?',message:detail,confirmText:'Delete item',danger:true}).then(function(confirmed){if(!confirmed)return;
gmsg('Removing item...','wait');google.script.run.withSuccessHandler(r=>{gmsg(r.message,r.success?'ok':'bad');if(r.success)refresh();}).withFailureHandler(e=>gmsg('Script error: '+(e.message||e),'bad')).erpDeleteInventoryItem({adminPin:currentPin,itemId:itemId,confirmWithHistory:true});});
}).withFailureHandler(e=>gmsg('Script error: '+(e.message||e),'bad')).erpGetInventoryDeletePreview({adminPin:currentPin,itemId:itemId});}

/** Parses CSV/TSV text, honouring quoted fields and embedded newlines. */
function parseDelimited(text){const rows=[];let row=[],field='',quoted=false;
const body=String(text||'').replace(/^\ufeff/,'');
const delimiter=(body.split('\n')[0]||'').indexOf('\t')!==-1?'\t':',';
for(let i=0;i<body.length;i++){const ch=body[i];
if(quoted){if(ch==='"'){if(body[i+1]==='"'){field+='"';i++;}else quoted=false;}else field+=ch;continue;}
if(ch==='"'){quoted=true;continue;}
if(ch===delimiter){row.push(field);field='';continue;}
if(ch==='\r'){continue;}
if(ch==='\n'){row.push(field);rows.push(row);row=[];field='';continue;}
field+=ch;}
if(field!==''||row.length){row.push(field);rows.push(row);}
return rows.filter(r=>r.some(c=>String(c).trim()!==''));}
function normalizeHeading(value){return String(value||'').toLowerCase().replace(/[^a-z0-9]/g,'');}
function readInventoryCsv(){const input=document.getElementById('invCsvFile');const preview=document.getElementById('invImportPreview');const result=document.getElementById('invImportResult');
result.innerHTML='';inventoryImportRows=null;
const file=input&&input.files&&input.files[0];if(!file){preview.innerHTML='';return;}
if(file.size>2*1024*1024){preview.innerHTML='<p class="empty-state">That file is larger than 2MB. Split it and import in parts.</p>';return;}
const reader=new FileReader();
reader.onerror=function(){preview.innerHTML='<p class="empty-state">That file could not be read.</p>';};
reader.onload=function(event){try{
const rows=parseDelimited(event.target.result);
if(rows.length<2){preview.innerHTML='<p class="empty-state">The file needs a heading row and at least one item row.</p>';return;}
const cols=(D.inventoryRefData&&D.inventoryRefData.importColumns)||[];
const lookup={};cols.forEach(c=>{lookup[normalizeHeading(c.header)]=c.key;lookup[normalizeHeading(c.key)]=c.key;});
const headings=rows[0].map(h=>lookup[normalizeHeading(h)]||'');
if(headings.indexOf('itemName')===-1){preview.innerHTML='<p class="empty-state">No <b>Item Name</b> column was found in the heading row. Check the column reference below.</p>';return;}
const parsed=rows.slice(1).map(function(line){const record={};headings.forEach(function(key,index){if(key)record[key]=String(line[index]==null?'':line[index]).trim();});return record;}).filter(r=>String(r.itemName||'').trim());
if(!parsed.length){preview.innerHTML='<p class="empty-state">No rows carried an item name.</p>';return;}
inventoryImportRows=parsed;
let html='<p class="muted">'+parsed.length+' row(s) ready. Showing the first '+Math.min(5,parsed.length)+'.</p><div class="tablewrap import-preview"><table><tr><th>Item Name</th><th>Category</th><th>Unit</th><th class="num">Opening</th><th class="num">Reorder</th><th>Location</th></tr>';
parsed.slice(0,5).forEach(function(r){html+='<tr><td>'+esc(r.itemName)+'</td><td>'+esc(r.category||'-')+'</td><td>'+esc(r.unit||'-')+'</td><td class="num">'+esc(r.openingStock||'0')+'</td><td class="num">'+esc(r.reorderLevel||'0')+'</td><td>'+esc(r.location||'-')+'</td></tr>';});
html+='</table></div><button class="green" onclick="importInventoryCsv()"><i data-lucide="upload"></i> Import '+parsed.length+' row(s)</button>';
preview.innerHTML=html;
}catch(err){preview.innerHTML='<p class="empty-state">That file could not be parsed: '+esc(err.message||err)+'</p>';}};
reader.readAsText(file);}

if(result&&r.success){let html='<div class="ok">'+r.created.length+' created, '+r.updated.length+' updated.</div>';
if(r.skipped&&r.skipped.length)html+=r.skipped.map(line=>'<div class="bad">'+esc(line)+'</div>').join('');
result.innerHTML=html;}
if(r.success){inventoryImportRows=null;const input=document.getElementById('invCsvFile');if(input)input.value='';refresh();}
}).withFailureHandler(e=>gmsg('Script error: '+(e.message||e),'bad')).erpImportInventoryItems({adminPin:currentPin,rows:inventoryImportRows});}

/*
 * New client details on the Projects and Leads forms.
 *
 * Typing a company nobody has traded with before used to create a Clients row
 * holding nothing but the name, and somebody had to go to the Clients page and
 * fill in the contact all over again. These fields ride along with whichever
 * form is open and build the master record in the same save.
 *
 * They are sent `client`-prefixed because a project's own Location and Notes
 * are not the client's: without the prefix an event venue would be filed as the
 * company's address. An existing client is never overwritten from here - the
 * server only fills in fields the Clients record has left blank.
 */
const CLIENT_FORMS={
  prj:{select:'prjClientId',name:'prjClient',block:'prjNewClient',info:'prjClientInfo',fields:['Person','Role','Email','Phone','Sector','Location','Website']},
  ld:{select:'ldClientId',name:'ldClientName',block:'ldNewClient',info:'ldClientInfo',fields:['Role','Sector','Location','Website'],mirror:{Person:'ldContact',Email:'ldEmail',Phone:'ldPhone'}}
};
function newClientField(prefix,key){const id=prefix+'Cc'+key;const labels={Person:'Contact person',Role:'Role / title',Email:'Email',Phone:'Phone',Sector:'Sector',Location:'Location',Website:'Website'};const type=key==='Email'?' type="email"':'';const hint={Sector:'Oil & Gas',Location:'Abuja',Website:'movingsurface.com.ng'}[key];return '<div><label for="'+id+'">'+labels[key]+'</label><input id="'+id+'"'+type+(hint?' placeholder="'+esc(hint)+'"':'')+'></div>';}
function newClientBlock(prefix){const cfg=CLIENT_FORMS[prefix];const mirrored=cfg.mirror?' The contact person, email and phone above are saved to the client too.':'';return '<div id="'+cfg.info+'" class="client-note hidden"></div><div id="'+cfg.block+'" class="subform hidden"><p class="muted"><b>New client details</b> — saved to the Clients record in this same step, so you do not have to enter the company twice.'+mirrored+' Leave blank anything you do not have yet.</p><div class="three">'+cfg.fields.map(key=>newClientField(prefix,key)).join('')+'</div></div>';}
/* Shows the detail fields only while the company is genuinely new, and reports
   what is already on file when an existing one is picked. */
function syncClientForm(prefix){const cfg=CLIENT_FORMS[prefix];const select=document.getElementById(cfg.select);if(!select)return;const nameInput=document.getElementById(cfg.name),block=document.getElementById(cfg.block),info=document.getElementById(cfg.info);const chosen=select.value;const known=(D.clients||[]).filter(c=>c.clientId===chosen)[0];if(known){if(nameInput){nameInput.value='';nameInput.disabled=true;nameInput.placeholder='Using '+known.clientName;}if(block)block.classList.add('hidden');if(cfg.mirror)Object.keys(cfg.mirror).forEach(key=>{const field=document.getElementById(cfg.mirror[key]);const source={Person:known.contactPerson,Email:known.email,Phone:known.phone}[key];if(field&&!field.value&&source)field.value=source;});if(info){const held=[['contact',known.contactPerson],['email',known.email],['phone',known.phone],['sector',known.sector]].filter(pair=>pair[1]);info.classList.remove('hidden');info.innerHTML='On file for '+esc(known.clientName)+': '+(held.length?held.map(pair=>esc(pair[0])+' '+esc(pair[1])).join(' · '):'name only — anything you type here will fill the gaps.');}return;}
if(nameInput){nameInput.disabled=false;nameInput.placeholder='';}
if(info){info.classList.add('hidden');info.innerHTML='';}
if(block)block.classList.toggle('hidden',!(nameInput&&nameInput.value.trim()));}
/* The client fields to send with an Add Project / Add Lead payload. */
function newClientPayload(prefix){const cfg=CLIENT_FORMS[prefix],out={};cfg.fields.forEach(key=>{out['client'+({Person:'ContactPerson',Role:'RoleTitle'}[key]||key)]=val(prefix+'Cc'+key);});return out;}

function renderProjectDetail(res){const panel=document.getElementById('projectDetailPanel');if(!panel)return;const r=res.project;

html+='<div class="grid">'+kpi('Contract value',money(r.contractValue),'Revenue')+kpi('Expenditure budget',money(r.budget),'Approved plan')+kpi('Itemized plan',money(r.plannedCost),'Sum of cost lines')+kpi('Actual spend',money(r.actualSpend),'Incurred')+kpi('Budget variance',money(r.budgetVariance),r.overBudget?'OVER BUDGET':'Remaining')+kpi('Project balance',money(r.balance),'Revenue less spend')+kpi('Margin',r.contractValue>0?pct(r.marginPct):'-','Of contract value')+kpi('Receivable',money(r.receivable),money(r.invoiced)+' invoiced')+'</div>';

if(res.categoryBreakdown.length){html+='<h3>Where the money goes</h3><div class="tablewrap"><table><tr><th>Category</th><th>Lines</th><th>Planned</th><th>Actual</th></tr>';res.categoryBreakdown.forEach(c=>{html+='<tr><td>'+esc(c.category)+'</td><td>'+c.lines+'</td><td>'+money(c.planned)+'</td><td>'+money(c.actual)+'</td></tr>';});html+='</table></div>';}
html+='<h3>Cost lines</h3><div class="tablewrap"><table><tr><th>Line</th><th>Date</th><th>Category</th><th>Description</th><th>Payee</th><th>Planned</th><th>Actual</th><th>Status</th><th>Source</th><th></th></tr>';
if(!res.costLines.length)html+='<tr><td colspan="10" class="empty-state">No cost lines yet. Add one below, or they appear automatically when a requisition or expense claim for this project is approved.</td></tr>';
res.costLines.forEach(c=>{html+='<tr'+(c.paymentStatus==='Cancelled'?' class="muted"':'')+'><td>'+esc(c.lineId)+'</td><td>'+esc(c.costDate)+'</td><td>'+esc(c.category)+'</td><td>'+esc(c.description)+'</td><td>'+esc(c.vendor||'-')+'</td><td>'+money(c.plannedAmount)+'</td><td>'+money(c.actualAmount)+'</td><td>'+esc(c.paymentStatus)+'</td><td>'+esc(c.sourceModule==='Manual'?'Manual':c.sourceModule+' '+c.sourceRefId)+'</td><td>';if(res.canWrite&&c.paymentStatus!=='Paid'&&c.paymentStatus!=='Cancelled'){html+='<input id="costref_'+esc(c.lineId)+'" placeholder="Payment ref"><button class="smallbtn green" onclick="payProjectCost(\''+esc(c.lineId)+'\')">Mark paid</button>';if(c.sourceModule==='Manual')html+='<button class="smallbtn danger" onclick="cancelProjectCost(\''+esc(c.lineId)+'\')">Cancel</button>';}html+='</td></tr>';});
html+='</table></div>';
if(res.requisitions.length){html+='<h3>Requisitions on this project</h3><div class="tablewrap"><table><tr><th>Request</th><th>Staff</th><th>Status</th><th>Total</th></tr>';res.requisitions.forEach(x=>{html+='<tr><td>'+esc(x.reqId)+'</td><td>'+esc(x.staffName)+'</td><td>'+esc(x.status)+'</td><td>'+money(x.total)+'</td></tr>';});html+='</table></div>';}
if(res.expenses.length){html+='<h3>Expense claims on this project</h3><div class="tablewrap"><table><tr><th>Claim</th><th>Staff</th><th>Category</th><th>Status</th><th>Amount</th></tr>';res.expenses.forEach(x=>{html+='<tr><td>'+esc(x.claimId)+'</td><td>'+esc(x.staffName)+'</td><td>'+esc(x.category)+'</td><td>'+esc(x.status)+'</td><td>'+money(x.amount)+'</td></tr>';});html+='</table></div>';}
if(res.inventoryIssues.length){html+='<h3>Stock issued to this project</h3><p class="muted">Tracked as movement, not cost: inventory transactions carry no price.</p><div class="tablewrap"><table><tr><th>Txn</th><th>Item</th><th>Type</th><th>Qty</th><th>Date</th></tr>';res.inventoryIssues.forEach(x=>{html+='<tr><td>'+esc(x.txId)+'</td><td>'+esc(x.itemName)+'</td><td>'+esc(x.type)+'</td><td>'+x.quantity+'</td><td>'+esc(x.timestamp)+'</td></tr>';});html+='</table></div>';}
if(res.assetMovements.length){html+='<h3>Equipment deployed</h3><div class="tablewrap"><table><tr><th>Movement</th><th>Asset</th><th>Action</th><th>Holder</th><th>Date</th></tr>';res.assetMovements.forEach(x=>{html+='<tr><td>'+esc(x.movementId)+'</td><td>'+esc(x.assetName)+'</td><td>'+esc(x.action)+'</td><td>'+esc(x.staffName||'-')+'</td><td>'+esc(x.timestamp)+'</td></tr>';});html+='</table></div>';}
html+='</div>';
if(res.canWrite){html+='<div class="card"><h3>Add cost line to '+esc(r.projectId)+'</h3><p class="muted">Planned amounts build the itemized plan. Actual amounts are what moves Actual Spend.</p><div class="three"><div><label for="pclCat">Category</label><select id="pclCat">'+optionList(res.categories,'Logistics / Transport')+'</select></div><div><label for="pclDesc">Description</label><input id="pclDesc"></div><div><label for="pclVendor">Vendor / payee</label><input id="pclVendor"></div><div><label for="pclDate">Cost date</label><input id="pclDate" type="date"></div><div><label for="pclQty">Quantity</label><input id="pclQty" type="number" min="0" step="any" placeholder="0"></div><div><label for="pclUnit">Unit</label><input id="pclUnit" placeholder="days, trips, pax"></div><div><label for="pclUnitCost">Unit cost</label><input id="pclUnitCost" type="number" min="0" placeholder="0"></div><div><label for="pclPlanned">Planned amount</label><input id="pclPlanned" type="number" min="0" placeholder="Qty x unit cost"></div><div><label for="pclActual">Actual amount</label><input id="pclActual" type="number" min="0" placeholder="Leave blank until paid"></div><div><label for="pclStatus">Payment status</label><select id="pclStatus">'+optionList(res.paymentStatuses,'Planned')+'</select></div></div><label for="pclNotes">Notes</label><textarea id="pclNotes"></textarea><button class="green" onclick="addProjectCost()">Add cost line</button></div>';
html+='<div class="card"><h3>Update '+esc(r.projectId)+'</h3><div class="three"><div><label for="prjUpStatus">Status</label><select id="prjUpStatus">'+optionList(D.projectStatuses||[],r.status)+'</select></div><div><label for="prjUpContract">Contract value</label><input id="prjUpContract" type="number" min="0" value="'+Number(r.contractValue)+'"></div><div><label for="prjUpBudget">Expenditure budget</label><input id="prjUpBudget" type="number" min="0" value="'+Number(r.budget)+'"></div><div><label for="prjUpInvoiced">Invoiced to date</label><input id="prjUpInvoiced" type="number" min="0" value="'+Number(r.invoiced)+'"></div><div><label for="prjUpReceived">Received to date</label><input id="prjUpReceived" type="number" min="0" value="'+Number(r.received)+'"></div><div><label for="prjUpManager">Project manager</label><input id="prjUpManager" value="'+esc(r.manager)+'"></div></div><button class="green" onclick="updateProject()">Save project</button></div>';}
panel.innerHTML=html;refreshIcons(panel);}
function addProjectCost(){if(!projectDetail)return;const p={adminPin:currentPin,projectId:projectDetail.project.projectId,category:val('pclCat'),description:val('pclDesc'),vendor:val('pclVendor'),costDate:val('pclDate'),quantity:val('pclQty'),unit:val('pclUnit'),unitCost:val('pclUnitCost'),plannedAmount:val('pclPlanned'),actualAmount:val('pclActual'),paymentStatus:val('pclStatus'),notes:val('pclNotes')};gmsg('Adding cost line...','wait');google.script.run.withSuccessHandler(r=>{gmsg(r.message,r.success?'ok':'bad');if(r.success){const id=p.projectId;refresh();openProjectDetail(id);}}).withFailureHandler(e=>gmsg('Script error: '+(e.message||e),'bad')).erpAddProjectCostLine(p);}
function payProjectCost(lineId){if(!projectDetail)return;const p={adminPin:currentPin,lineId:lineId,paymentReference:val('costref_'+lineId)};gmsg('Marking cost line paid...','wait');google.script.run.withSuccessHandler(r=>{gmsg(r.message,r.success?'ok':'bad');if(r.success){const id=projectDetail.project.projectId;refresh();openProjectDetail(id);}}).withFailureHandler(e=>gmsg('Script error: '+(e.message||e),'bad')).erpMarkProjectCostPaid(p);}
function cancelProjectCost(lineId){if(!projectDetail)return;const p={adminPin:currentPin,lineId:lineId,reason:'Cancelled from the project detail view'};gmsg('Cancelling cost line...','wait');google.script.run.withSuccessHandler(r=>{gmsg(r.message,r.success?'ok':'bad');if(r.success){const id=projectDetail.project.projectId;refresh();openProjectDetail(id);}}).withFailureHandler(e=>gmsg('Script error: '+(e.message||e),'bad')).erpCancelProjectCostLine(p);}
function updateProject(){if(!projectDetail)return;const p={adminPin:currentPin,projectId:projectDetail.project.projectId,status:val('prjUpStatus'),contractValue:val('prjUpContract'),budget:val('prjUpBudget'),invoiced:val('prjUpInvoiced'),received:val('prjUpReceived'),manager:val('prjUpManager')};gmsg('Saving project...','wait');google.script.run.withSuccessHandler(r=>{gmsg(r.message,r.success?'ok':'bad');if(r.success){const id=p.projectId;refresh();openProjectDetail(id);}}).withFailureHandler(e=>gmsg('Script error: '+(e.message||e),'bad')).erpUpdateProject(p);}

/*************** LEADS ***************/
function followupCell(r){if(!r.nextFollowup)return '<span class="muted">Not scheduled</span>';if(r.followupOverdue)return '<span style="color:#b83b43;font-weight:700">'+esc(r.nextFollowup)+' ('+Math.abs(r.daysToFollowup)+'d overdue)</span>';if(r.followupDueSoon)return '<span style="color:#bd7517;font-weight:700">'+esc(r.nextFollowup)+' (in '+r.daysToFollowup+'d)</span>';return esc(r.nextFollowup)+' <span class="muted">(in '+r.daysToFollowup+'d)</span>';}
function drawLeads(){const s=D.leadSummary||{};let html='<div class="grid">'+kpi('Open leads',s.open||0,'Still in play')+kpi('Pipeline value',money(s.pipelineValue),'Open opportunities')+kpi('Weighted pipeline',money(s.weightedValue),'Value x probability')+kpi('Contracted',money(s.contractedValue),'Won deals')+kpi('Overdue follow-ups',s.overdueFollowups||0,'Need contact now')+kpi('Due within 3 days',s.dueSoonFollowups||0,'Final reminder window')+'</div>';
if(s.byStage&&s.byStage.length){html+='<div class="card"><h3>Pipeline by stage</h3><div class="tablewrap"><table><tr><th>Stage</th><th>Leads</th><th>Value</th></tr>';s.byStage.forEach(x=>{html+='<tr><td>'+esc(x.stage)+'</td><td>'+x.count+'</td><td>'+money(x.value)+'</td></tr>';});html+='</table></div></div>';}
html+='<div class="card"><div class="section-title"><div><h3>Leads</h3><p class="muted">One row per opportunity, so a repeat client can carry several deals at once. Reminders go out weekly, with a final reminder three days before each follow-up date.</p></div><a class="sheet-link" href="'+esc(sheetLink('Leads')||'#')+'" target="_blank" rel="noopener">Open leads sheet</a></div><div class="tablewrap"><table><tr><th>ID</th><th>Client</th><th>Opportunity</th><th>Stage</th><th>Prob.</th><th>Value</th><th>Next follow-up</th><th>Owner</th><th></th></tr>';
if(!D.leads.length)html+='<tr><td colspan="9" class="empty-state">No leads yet. Add one below to start tracking the pipeline.</td></tr>';
D.leads.forEach(r=>{html+='<tr><td>'+esc(r.leadId)+'</td><td>'+esc(r.clientName)+'</td><td>'+esc(r.opportunity)+'</td><td>'+esc(r.stage)+'</td><td>'+r.probability+'%</td><td>'+money(r.estimatedValue)+'</td><td>'+followupCell(r)+'</td><td>'+esc(r.ownerName||'Unassigned')+'</td><td><button class="smallbtn gray" onclick="openLeadDetail(\''+esc(r.leadId)+'\')">Open</button></td></tr>';});
html+='</table></div></div><div id="leadDetailPanel"></div>';
html+='<div class="card"><div class="section-title"><div><h3>Clients</h3><p class="muted">The master record each lead and project points at, so a client is spelled one way everywhere.</p></div><a class="sheet-link" href="'+esc(sheetLink('Clients')||'#')+'" target="_blank" rel="noopener">Open clients sheet</a></div><div class="tablewrap"><table><tr><th>ID</th><th>Client</th><th>Contact</th><th>Email</th><th>Phone</th><th>Sector</th><th>Status</th><th>Last contact</th></tr>';
if(!D.clients.length)html+='<tr><td colspan="8" class="empty-state">No clients yet.</td></tr>';
D.clients.forEach(r=>{html+='<tr><td>'+esc(r.clientId)+'</td><td>'+esc(r.clientName)+'</td><td>'+esc(r.contactPerson||'-')+'</td><td>'+esc(r.email||'-')+'</td><td>'+esc(r.phone||'-')+'</td><td>'+esc(r.sector||'-')+'</td><td>'+esc(r.relationshipStatus)+'</td><td>'+esc(r.lastContact||'-')+'</td></tr>';});
html+='</table></div></div>'+(D.user.access.writePages.includes('leads')?leadForm()+clientForm():'<p class="muted">You have view-only access to leads.</p>');
document.getElementById('tab_leads').innerHTML=html;syncClientForm('ld');if(leadDetail)renderLeadDetail(leadDetail);}

function addLead(){const p=Object.assign({adminPin:currentPin,clientId:val('ldClientId'),clientName:val('ldClientName'),opportunity:val('ldOpportunity'),contactPerson:val('ldContact'),email:val('ldEmail'),phone:val('ldPhone'),source:val('ldSource'),stage:val('ldStage'),estimatedValue:val('ldValue'),expectedClose:val('ldClose'),nextFollowup:val('ldNext'),cadence:val('ldCadence'),owner:val('ldOwner'),notes:val('ldNotes')},newClientPayload('ld'));gmsg('Adding lead...','wait');google.script.run.withSuccessHandler(r=>{gmsg(r.message,r.success?'ok':'bad');if(r.success)refresh();}).withFailureHandler(e=>gmsg('Script error: '+(e.message||e),'bad')).erpAddLead(p);}

function openLeadDetail(leadId){const panel=document.getElementById('leadDetailPanel');if(panel)panel.innerHTML='<div class="card">'+loadingMarkup('Loading lead history…')+'</div>';google.script.run.withSuccessHandler(function(res){if(!res||!res.success){gmsg((res&&res.message)||'Lead detail could not be loaded.','bad');if(panel)panel.innerHTML='';return;}leadDetail=res;renderLeadDetail(res);}).withFailureHandler(e=>gmsg('Script error: '+(e.message||e),'bad')).erpGetLeadDetail({adminPin:currentPin,leadId:leadId});}

function renderLeadDetail(res){const panel=document.getElementById('leadDetailPanel');if(!panel)return;const r=res.lead,c=res.client,ref=D.leadRefData||{};

html+='<div class="tablewrap"><table><tr><th>Contact</th><td>'+esc(r.contactPerson||c&&c.contactPerson||'-')+'</td><th>Email</th><td>'+esc(r.email||c&&c.email||'-')+'</td><th>Phone</th><td>'+esc(r.phone||c&&c.phone||'-')+'</td></tr><tr><th>Estimated value</th><td>'+money(r.estimatedValue)+'</td><th>Contract value</th><td>'+money(r.contractValue)+'</td><th>Weighted</th><td>'+money(r.weightedValue)+'</td></tr><tr><th>Last contact</th><td>'+esc(r.lastContact||'-')+'</td><th>Next follow-up</th><td>'+followupCell(r)+'</td><th>Cadence</th><td>'+esc(r.cadence)+'</td></tr><tr><th>Source</th><td>'+esc(r.source||'-')+'</td><th>Expected close</th><td>'+esc(r.expectedClose||'-')+'</td><th>Last reminder</th><td>'+esc(r.lastReminderSent||'None sent')+'</td></tr></table></div>';

if(res.rollup){const t=res.rollup.linkedTotals,ct=res.rollup.clientTotals;html+='<h3>Projects from this lead</h3>';if(res.rollup.linkedProjects.length){html+='<div class="tablewrap"><table><tr><th>Project</th><th>Name</th><th>Status</th><th>Contract</th><th>Spend</th><th>Balance</th><th>Margin</th><th>Receivable</th></tr>';res.rollup.linkedProjects.forEach(x=>{html+='<tr><td>'+esc(x.projectId)+'</td><td>'+esc(x.projectName)+'</td><td>'+esc(x.status)+'</td><td>'+money(x.contractValue)+'</td><td>'+money(x.actualSpend)+'</td><td>'+money(x.balance)+'</td><td>'+(x.contractValue>0?pct(x.marginPct):'-')+'</td><td>'+money(x.receivable)+'</td></tr>';});html+='<tr><th>Total</th><th>'+t.count+' project(s)</th><th></th><th>'+money(t.contractValue)+'</th><th>'+money(t.actualSpend)+'</th><th>'+money(t.balance)+'</th><th>'+(t.contractValue>0?pct(t.marginPct):'-')+'</th><th>'+money(t.receivable)+'</th></tr></table></div>';}else{html+='<p class="muted">No project is linked to this lead yet.</p>';}
html+='<h3>This client overall</h3><div class="grid">'+kpi('Projects',ct.count,'For '+esc(r.clientName))+kpi('Revenue',money(ct.contractValue),'Contracted')+kpi('Spend',money(ct.actualSpend),'Actual')+kpi('Balance',money(ct.balance),'Returned after cost')+kpi('Margin',ct.contractValue>0?pct(ct.marginPct):'-','Lifetime')+kpi('Receivable',money(ct.receivable),'Still owed')+'</div>';}
html+='<h3>Contact history</h3><div class="tablewrap"><table><tr><th>When</th><th>Type</th><th>Outcome</th><th>Stage</th><th>Next set</th><th>By</th></tr>';

html+='</table></div></div>';
if(res.canWrite){html+='<div class="card"><h3>Log contact on '+esc(r.leadId)+'</h3><p class="muted">Logging a contact clears the reminder stamp, so the new follow-up date starts a fresh reminder cycle.</p><div class="three"><div><label for="laType">Activity</label><select id="laType">'+optionList(res.activityTypes,'Call')+'</select></div><div><label for="laDirection">Direction</label><select id="laDirection">'+placeholderOption('Select a direction…')+'<option>Outbound</option><option>Inbound</option><option>Internal</option></select></div><div><label for="laNext">Next follow-up</label><input id="laNext" type="date"></div></div><label for="laOutcome">Outcome</label><input id="laOutcome" placeholder="What came out of the contact"><label for="laNotes">Notes</label><textarea id="laNotes"></textarea><button class="green" onclick="logLeadActivity()">Log contact</button></div>';

function renderUserManagement(){

    <div id="customManagedRoleEditor" hidden><label for="newManagedRole">New role label</label><div class="user-role-add"><input id="newManagedRole" maxlength="60" placeholder="Enter a role label"><button type="button" class="smallbtn secondary" onclick="addManagedRoleLabel()">Add role label</button></div><small class="muted">The new label becomes available after you save it on an account.</small></div></div>

    <div class="user-capabilities">

    <label><input id="managedOnboard" type="checkbox" ${account&&account.canOnboard?'checked':''}> Can onboard or manage staff</label></div>
    <div class="permission-matrix"><div class="section-title"><div><h3>Page permissions</h3><p class="muted">Write access includes read access. Dashboard read access is required for sign-in.</p></div></div>
    <div class="tablewrap"><table><thead><tr><th>Page</th><th>Read</th><th>Write</th></tr></thead><tbody>${permissionRows}</tbody></table></div></div>
    <div class="users-save-row"><button type="button" class="green" onclick="saveManagedUserAccess()">${account?'Save changes':'Create access account'}</button>
    <span class="muted">${userAccessMode==='create'&&!activeStaff.length?'All active staff already have an access account.':'Changes are recorded in the Activity Log.'}</span></div>`;
  if(account&&mappedStaffId){

function drawStaffReportSearch(){const root=document.getElementById('tab_reports'),oldCard=root.querySelector('.staff-report-search-card'),oldDialog=document.getElementById('staffReportDialog');if(oldCard)oldCard.remove();if(oldDialog)oldDialog.remove();const card=document.createElement('div');card.className='card staff-report-search-card';card.innerHTML='<div class="section-title"><div><h3>Individual staff report</h3><p class="muted">Search by staff name or ID to review that person’s records across the system.</p></div></div><label for="staffReportSearch">Staff name or ID</label><input id="staffReportSearch" type="search" autocomplete="off" placeholder="Search active or former staff"><div id="staffReportResults" class="staff-report-results" aria-live="polite"></div>';root.insertBefore(card,root.firstChild);const dialog=document.createElement('dialog');dialog.id='staffReportDialog';dialog.className='confirm-dialog staff-report-dialog';dialog.setAttribute('aria-labelledby','staffReportTitle');dialog.innerHTML='<div class="staff-report-heading"><div><h2 id="staffReportTitle">Staff report</h2><p id="staffReportStatus" class="muted">Loading records…</p></div><button type="button" class="smallbtn secondary" onclick="closeStaffReport()" aria-label="Close staff report">Close</button></div><div id="staffReportContent"></div>';document.body.appendChild(dialog);document.getElementById('staffReportSearch').addEventListener('input',renderStaffReportMatches);}

function renderAnalytics(res){if(!res||!res.success){document.getElementById('analyticsMetrics').innerHTML='<p class="empty-state" role="alert">Analytics could not be calculated. Try again.</p>';gmsg((res&&res.message)||'Analytics could not be loaded.','bad');return;}D.analytics=res;const m=res.metrics;document.getElementById('analyticsUpdated').textContent='Updated '+res.generatedAt+' | Attendance period: '+(res.period.from||'all available')+' to '+(res.period.to||'today');document.getElementById('analyticsMetrics').innerHTML=kpi('Active staff',m.activeStaff,'Current staff records')+kpi('Inactive staff',m.inactiveStaff,'Retained in Staff List')+kpi('Check-ins',m.attendanceCheckIns,'Selected attendance period')+kpi('Regular checkouts',m.regularCheckouts,'Selected attendance period')+kpi('Overtime checkouts',m.overtimeCheckouts,'Selected attendance period')+kpi('Overtime days',m.overtimeDays,'Unique staff-days in period')+kpi('Late arrivals',m.late,'Selected attendance period')+kpi('Open requisitions',m.pendingRequisitions,'Needs approval')+kpi('Requisition estimate',money(m.requisitionValue),'All requisitions')+kpi('Expense claims',m.expenseClaims,money(m.expenseAmount)+' total value')+kpi('Monthly salary commitment',money(m.monthlySalaryCommitment),'Active staff')+kpi('Low stock items',m.inventoryLowStock,'Needs review')+kpi('Active projects',m.activeProjects,'Current projects');drawBars('dailyChart',res.dailyAttendance.slice(-14).map(row=>({label:row.date.slice(5),value:row.count})),true);drawBars('attendanceChart',res.attendanceByStatus,false);drawBars('requisitionChart',res.requisitionsByStatus,false);drawBars('expenseChart',res.expensesByStatus,false);}
function drawBars(id,series,vertical){const root=document.getElementById(id);if(!series.length){root.innerHTML='<p class="empty-state">No data for this period.</p>';return;}const max=Math.max(1,...series.map(item=>Number(item.value)||0));if(vertical){root.innerHTML='<div class="column-chart">'+series.map(item=>'<div class="column-item" title="'+esc(item.label)+': '+esc(item.value)+'"><span>'+esc(item.value)+'</span><div class="column-track"><i style="height:'+Math.max(3,(Number(item.value)||0)/max*100)+'%"></i></div><small>'+esc(item.label)+'</small></div>').join('')+'</div>';return;}root.innerHTML=series.map(item=>'<div class="bar-row"><span>'+esc(item.label)+'</span><div class="bar-track"><i style="width:'+Math.max(item.value?2:0,(Number(item.value)||0)/max*100)+'%"></i></div><b>'+esc(item.value)+'</b></div>').join('');}
function drawActivity(){document.getElementById('tab_activity').innerHTML='<div class="card"><div class="section-title"><div><h3>Activity log</h3><p class="muted">Successful sign-ins, attendance, staff changes, approvals, and other recorded operations.</p></div></div><div class="filter-grid"><div><label for="activityFrom">From</label><input id="activityFrom" type="date" onchange="loadActivityPage(1)"></div><div><label for="activityTo">To</label><input id="activityTo" type="date" onchange="loadActivityPage(1)"></div><div><label for="activityAction">Activity</label><select id="activityAction" onchange="loadActivityPage(1)"><option value="">All activities</option><option>SIGN IN</option><option>ATTENDANCE CHECK IN</option><option>ATTENDANCE CHECK OUT</option><option>CREATE</option><option>UPDATE</option><option>DELETE</option><option>DISABLE</option><option>REACTIVATE</option></select></div><div><label for="activitySort">Sort by time</label><select id="activitySort" onchange="loadActivityPage(1)"><option value="newest">Newest first</option><option value="oldest">Oldest first</option></select></div></div><div class="toolbar-search"><label class="visually-hidden" for="activitySearch">Search activity log</label><input id="activitySearch" type="search" placeholder="Search actor, staff ID, activity, record..." oninput="queueActivitySearch()"><button class="smallbtn gray" onclick="loadActivityPage(1)">Search</button></div><div id="activityResults" class="tablewrap"></div><div id="activityPager" class="pager"></div></div>';}
function queueActivitySearch(){clearTimeout(attendanceTimer);attendanceTimer=setTimeout(()=>loadActivityPage(1),250);}
function loadActivityPage(page){if(!currentPin||!document.getElementById('activityResults'))return;document.getElementById('activityResults').innerHTML=loadingMarkup('Loading activity records…');google.script.run.withSuccessHandler(renderActivityPage).withFailureHandler(e=>{document.getElementById('activityResults').innerHTML='<p class="empty-state" role="alert">Activity records could not be loaded. Try again.</p>';gmsg('Activity log could not be loaded: '+(e.message||e),'bad');}).adminGetActivityPage({adminPin:currentPin,page:page,query:val('activitySearch'),action:val('activityAction'),from:val('activityFrom'),to:val('activityTo'),sort:val('activitySort')});}
function renderActivityPage(res){if(!res||!res.success){document.getElementById('activityResults').innerHTML='<p class="empty-state" role="alert">Activity records could not be loaded. Try again.</p>';gmsg((res&&res.message)||'Activity log could not be loaded.','bad');return;}activityState=res;let html='<table><thead><tr><th>Timestamp</th><th>Actor</th><th>Reference ID</th><th>Activity</th><th>Record</th><th>Details</th></tr></thead><tbody>';if(!res.rows.length)html+='<tr><td colspan="6">No activity matches these filters.</td></tr>';res.rows.forEach(row=>{html+='<tr><td>'+esc(row.timestamp)+'</td><td>'+esc(row.actorName)+'<br><span class="muted">'+esc(row.actorType)+'</span></td><td>'+esc(row.actorId)+'</td><td><span class="pill">'+esc(row.action)+'</span></td><td>'+esc(row.entity)+'<br><span class="muted">'+esc(row.entityId)+'</span></td><td>'+esc(row.details)+'</td></tr>';});html+='</tbody></table>';document.getElementById('activityResults').innerHTML=html;document.getElementById('activityPager').innerHTML=pagerHtml(res,'activity');}
function pagerHtml(res,kind){const pages=res.totalPages||0,label=pages?'Page '+res.page+' of '+pages+' | '+res.total+' records':'0 records';return '<span class="muted">'+label+'</span><div><button class="smallbtn secondary" '+(res.page<=1?'disabled':'')+' onclick="load'+(kind==='activity'?'Activity':'Attendance')+'Page('+(res.page-1)+')">Previous</button><button class="smallbtn secondary" '+(res.page>=pages?'disabled':'')+' onclick="load'+(kind==='activity'?'Activity':'Attendance')+'Page('+(res.page+1)+')">Next</button></div>';}
let dashboardSearchTimer=null;
function queueDashboardSearch(query){clearTimeout(dashboardSearchTimer);dashboardSearchTimer=setTimeout(()=>searchDashboardData(query),180);}
function searchDashboardData(query){const panel=document.getElementById('globalSearchResults'),term=String(query||'').trim().toLowerCase();if(!term||!D){panel.classList.add('hidden');panel.innerHTML='';return;}const sections=[['Staff','staff','id','staff'],['Requisition','requisitions','reqId','requisitions'],['Inventory','inventory','itemId','inventory'],['Asset','assets','assetId','assets'],['Expense','expenses','claimId','expenses'],['Leave','leaveRequests','leaveId','leave'],['Project','projects','projectId','projects'],['Lead','leads','leadId','leads'],['Client','clients','clientId','leads']];const hits=[];sections.forEach(([label,key,idKey,page])=>{if(!D.user.access.readPages.includes(page))return;(D[key]||[]).forEach(row=>{if(JSON.stringify(row).toLowerCase().includes(term))hits.push({label:label,key:key,page:page,id:row[idKey]||'',title:row.name||row.staffName||row.itemName||row.assetName||row.projectName||row.opportunity||row.clientName||row.claimId||row.leaveId||row.reqId||''});});});panel.classList.remove('hidden');panel.innerHTML='<div class="section-title"><h3>Search results</h3><span class="muted">'+hits.length+' matches</span></div>'+(hits.length?'<div class="search-hit-list">'+hits.slice(0,12).map((hit,index)=>'<button class="search-hit" data-search-hit="'+index+'"><span>'+esc(hit.label)+'</span><b>'+esc(hit.title)+'</b><small>'+esc(hit.id)+'</small></button>').join('')+'</div>':'<p class="empty-state">No matching records in the pages you can view.</p>');panel.querySelectorAll('[data-search-hit]').forEach(button=>button.addEventListener('click',()=>{const hit=hits[Number(button.dataset.searchHit)],nav=document.querySelector('.navbtn[data-page="'+hit.page+'"]');showTab(hit.page,nav);}));}
function val(id){const el=document.getElementById(id);return el?el.value:'';}
function confirmAdminAction(handler,title,message,options){return async function(){const args=Array.from(arguments),description=typeof message==='function'?message.apply(this,args):message,confirmed=await window.confirmAppAction({title:title,message:description,confirmText:options&&options.confirmText,danger:options&&options.danger});if(!confirmed)return;return handler.apply(this,args);};}
window.saveStaff=confirmAdminAction(saveStaff,'Save staff changes?',()=>val('staff-id')?'Update this staff profile in Staff List?':'Create this staff profile in Staff List?');
window.submitNewStaff=confirmAdminAction(submitNewStaff,'Add staff member?','Create this staff profile in the Staff List?');
window.submitReset=confirmAdminAction(submitReset,'Reset staff credentials?','Apply the selected PIN or device reset to this staff member.',{danger:true});
window.decideReq=confirmAdminAction(decideReq,'Update requisition?',(id,decision)=>decision+' this requisition?');
window.markReqPaid=confirmAdminAction(markReqPaid,'Mark requisition paid?','Record this requisition as paid/disbursed.');
window.addInventory=confirmAdminAction(addInventory,'Add inventory item?','Create this item in the inventory register.');
window.postInventoryTxn=confirmAdminAction(postInventoryTxn,'Post inventory transaction?','Update the stock balance and record this transaction.');
window.importInventoryCsv=confirmAdminAction(importInventoryCsv,'Import these rows?','Items already in the register are updated; new names are created.');
window.addAsset=confirmAdminAction(addAsset,'Add asset?','Create this asset in the asset register.');
window.assignAsset=confirmAdminAction(assignAsset,'Assign asset?','Assign this asset to the selected staff member.');
window.returnAsset=confirmAdminAction(returnAsset,'Record asset return?','Update this asset as returned.');
window.submitExpense=confirmAdminAction(submitExpense,'Submit expense claim?','Create this expense claim for the selected staff member.');
window.decideExpense=confirmAdminAction(decideExpense,'Update expense claim?',(id,decision)=>decision+' this expense claim?');
window.payExpense=confirmAdminAction(payExpense,'Mark expense paid?','Record this expense claim as paid.');
window.submitLeave=confirmAdminAction(submitLeave,'Submit leave request?','Create this leave request for the selected staff member.');
window.decideLeave=confirmAdminAction(decideLeave,'Update leave request?',(id,decision)=>decision+' this leave request?');
window.addProject=confirmAdminAction(addProject,'Add project?','Create this project in the project register.');
window.updateProject=confirmAdminAction(updateProject,'Save project changes?','Update this project. Derived figures are recomputed from its cost lines.');
window.addProjectCost=confirmAdminAction(addProjectCost,'Add cost line?','Post this cost against the project.');
window.payProjectCost=confirmAdminAction(payProjectCost,'Mark cost line paid?','Record this cost line as paid and book its actual amount.');
window.cancelProjectCost=confirmAdminAction(cancelProjectCost,'Cancel cost line?','The line stays for audit but drops out of every roll-up.',{danger:true});
window.addClient=confirmAdminAction(addClient,'Add client?','Create this client in the client master.');
window.addLead=confirmAdminAction(addLead,'Add lead?','Create this opportunity in the pipeline.');
window.logLeadActivity=confirmAdminAction(logLeadActivity,'Log this contact?','Record the contact and reschedule the follow-up.');
window.moveLeadStage=confirmAdminAction(moveLeadStage,'Move this lead?','Update the pipeline stage and record the move in the lead history.');
window.createProjectFromLead=confirmAdminAction(createProjectFromLead,'Create project from lead?','Open a delivery record carrying this lead\'s client and contract value.');
window.linkProjectToLead=confirmAdminAction(linkProjectToLead,'Link this project?','Attach the selected project to this lead.');
</script>
